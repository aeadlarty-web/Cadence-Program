'Weighted Dips (belt)':'Chest focus: lean 20-30° forward. Triceps focus: upright, elbows tucked;Stop near 90° elbows, shoulders down;Pick one style for all 12 weeks|Too deep, shoulders rolled forward → stop higher|+2.5-5 lb when all sets hit 10. Shoulder flares? Use TRX Chest Press',

function ph(w){const rs=[4,8,12].includes(w),i=w>=9&&w<=11?2:w>=5&&w<=8?1:0;return{rs,i,k:w==12?'D':rs?'R':'FBP'[i],nm:w==0?'Calibration':w==12?'Deload':rs?'Reset':['Foundation','Build','Peak'][i]}}

const b=+r[2].split(',')[p.i],f=r[6]||'';return{c:r[0],n,reps,t,cat:r[5],o:f.includes('o'),ds:f.includes('d'),s:p.rs?Math.max(1,b-1):b,rir:p.k=='D'?'4':RIR[r[5]][p.k=='R'?3:p.i]}}

function lg(k,n){const a=S.logs[k]=S.logs[k]||[];while(a.filter(x=>!x.d).length<n)a.splice(a.filter(x=>!x.d).length,0,{w:'',r:'',k:0});return a}

const u=/s$/.test(e.reps)?'seconds':'reps',hi=ws.every(s=>+s.r>=top),lo=ws.some(s=>+s.r<bot),wt=ws.some(s=>+s.w>0),n=e.n;

const pd=t=>(t/PW).toFixed(1),fm=t=>Math.round(t).toLocaleString(),show=h=>{$('#sb').innerHTML=h;$('#sheet').style.display='flex'},cl=`<button class="btn" style="margin-top:14px" onclick="$('#sheet').style.display='none'">Close</button>`;
function vol(w,d){let t=0,nb=0;const bw=S.bw.length?S.bw[S.bw.length-1].v:0;Object.keys(S.logs).forEach(k=>{const a=k.split('|'),m=PM[a[2]];if(a[0]!=w||a[1]!=d||!m)return;S.logs[k].forEach(x=>{const r=+x.r,wt=+x.w||0;if(!x.k||!r)return;if(m=='B'){if(!bw)nb=1;t+=(wt+bw)*r}else if(wt)t+=wt*m[0]*r*m[1]})});return{t:Math.round(t),nb}}
function wvol(w){const o=['A','B','C','D'].map(d=>Object.assign({d},vol(w,d)));return{days:o,t:o.reduce((x,y)=>x+y.t,0),nb:o.some(x=>x.nb)}}
function reqDone(w,d){return DAYS[d].r.filter(r=>!(r[6]||'').includes('o')).every(r=>{const e=ex(r,w),L=(S.logs[key(w,d,e.n)]||[]).filter(x=>!x.d);return L.length>=e.s&&L.slice(0,e.s).every(x=>x.k)})}
function weekHtml(k,w){const b=k.days.reduce((x,y)=>y.t>x.t?y:x,{t:0});return`<h4>Week ${w} report</h4><div class="nm" style="font-size:22px">${fm(k.t)} lb · ${pd(k.t)} 🐼</div>${k.days.map(x=>`<div class="mu">${DAYS[x.d].n} ${DAYS[x.d].t}: ${fm(x.t)} lb · ${pd(x.t)} pandas</div>`).join('')}${b.t?`<div class="hint">Biggest day: ${DAYS[b.d].n} ${DAYS[b.d].t}</div>`:''}${k.nb?'<div class="hint">Log your body weight in the Log tab to include it on dips and pull-ups.</div>':''}`}
function finish(d,auto){const w=S.wk,a=vol(w,d),k=wvol(w);show(`<h3>🐼 ${auto?'All required sets done!':'Workout complete'}</h3><div class="nm" style="font-size:26px">${fm(a.t)} lb</div><div class="mu">${pd(a.t)} Giant Pandas lifted today</div>${a.nb?'<div class="hint">Log your body weight in the Log tab to include it on dips and pull-ups.</div>':''}${d=='D'?weekHtml(k,w):`<div class="mu" style="margin-top:10px">Week ${w} so far: ${fm(k.t)} lb · ${pd(k.t)} pandas</div>`}${cl}`)}
function weekRep(w){show(weekHtml(wvol(w),w)+cl)}
function pbtn(w){const t=wvol(w).t;return t?`<button class="btn" style="margin-top:8px" onclick="event.stopPropagation();weekRep(${w})">🐼 ${pd(t)} pandas · report</button>`:''}
function pandaCard(){let all=0,rows='';for(let w=0;w<=12;w++){const t=wvol(w).t;all+=t;if(t)rows+=`<div class="mu" style="padding:3px 0" onclick="weekRep(${w})">Week ${w}: ${fm(t)} lb · ${pd(t)} 🐼 ›</div>`}return`<div class="card"><div class="nm">🐼 Panda report</div><div class="mu">All-time: ${fm(all)} lb · ${pd(all)} Giant Pandas (330 lb each)</div>${rows||'<div class="mu">Finish a workout to start counting.</div>'}<div class="mu" style="margin-top:6px;font-size:12px">Estimate: belt lifts include your latest logged body weight. TRX, bands and core are not counted.</div></div>`}
const SX={chest:['TRX Chest Opener',30,0,'Face away from the anchor, arms wide on the handles, lean forward to a mild chest stretch. No TRX: doorway chest stretch.'],
lat:['TRX Lat Stretch',30,0,'Face the anchor, arms overhead on the handles, sit hips back and drop your chest. No TRX: kneel with hands on a bench.'],
tri:['Overhead Triceps Stretch',20,1,'Hand behind your head, gently press the elbow with your other hand.'],
sh:['Cross-Body Shoulder Stretch',20,1,'Pull one arm across your chest, keeping the shoulder down.'],
bi:['Biceps & Forearm Wall Stretch',20,1,'Palm flat on a wall, fingers back, slowly turn your body away.'],
ham:['TRX Hamstring Stretch',20,1,'Lie on your back, one heel in the cradle, leg straight up. No TRX: use a towel or band.'],
hip:['TRX Hip Flexor Stretch',20,1,'Back foot in the cradle, front foot forward in a lunge, tuck your pelvis. No TRX: kneeling lunge.'],
fig:['TRX Figure-4 Glute Stretch',20,1,'Hold the handles, cross one ankle over the opposite knee and sit back. No TRX: lie on your back.'],
quad:['Standing Quad Stretch',20,1,'Hold a TRX handle for balance, heel toward glute, knees together.'],
calf:['Wall Calf Stretch',15,1,'Hands on a wall, back leg straight, heel down.'],
hug:['Upper-Back Hug Stretch',30,0,'Hug yourself, round your upper back and reach forward.']};
const RT={A:['chest','lat','tri','sh','bi'],D:['chest','lat','tri','sh','bi'],B:['ham','hip','fig','quad','calf'],C:['chest','hip','ham','lat','hug']};
let X={};
function coolAsk(d){show(`<h3>🧘 Cool-down</h3><div class="mu">Stretch for about 3 minutes?</div><button class="btn" style="margin-top:12px" onclick="$('#sheet').style.display='none';cool('${d}')">Start stretch</button> <button class="btn" onclick="$('#sheet').style.display='none';finish('${d}')">Skip</button>`)}
function cool(d){stop();AC=AC||new(window.AudioContext||window.webkitAudioContext)();X={d,i:0,run:0};stDraw()}
function stDraw(){const L=RT[X.d],s=SX[L[X.i]],n=L.length,per=s[2];let b;
if(X.run)b=`<div class="mu">${s[0]}</div><div class="bigt" id="stt">0:00</div><div class="mu">${per?(X.side?'Switch sides! Side 2 of 2':'Side 1 of 2'):'Hold'}</div><div class="row2" style="margin-top:14px"><button class="btn" onclick="stPause()">${X.paused?'Resume':'Pause'}</button><button class="btn" onclick="stNext(1)">Skip</button></div>`;
else b=`<div class="mu">Stretch ${X.i+1} of ${n}</div><h2 style="color:var(--ac);margin:6px 0">${s[0]}</h2><div class="mu">${s[3]}</div><div class="meta">${s[1]} s${per?' per side':''} · mild tension, never pain</div><button class="go" onclick="stGo()">GO</button><div class="mu">${X.i<n-1?'Next: '+SX[L[X.i+1]][0]:'Last stretch'}</div><div class="row2" style="margin-top:12px"><button class="btn" onclick="stNext(-1)">Back</button><button class="btn" onclick="stNext(1)">Skip</button></div>`;
const o=$('#st');o.style.display='flex';o.innerHTML=`<div class="stc">${b}<button class="btn" style="margin-top:18px" onclick="stEnd()">End stretch</button></div>`;if(X.run)stTick(1)}
function stGo(){X.run=1;X.side=0;X.paused=0;AC=AC||new(window.AudioContext||window.webkitAudioContext)();wl();stStart()}
function stStart(){clearInterval(X.iv);X.end=Date.now()+SX[RT[X.d][X.i]][1]*1000;X.iv=setInterval(stTick,250);stDraw()}
function stTick(q){if(!X.run)return;const s=SX[RT[X.d][X.i]],r=X.paused?X.rem:Math.ceil((X.end-Date.now())/1000);
if(r<=0&&!q){clearInterval(X.iv);beep();if(s[2]&&!X.side){X.side=1;stStart()}else stNext(1);return}
const e=$('#stt');if(e){const v=Math.max(0,r);e.textContent=Math.floor(v/60)+':'+String(v%60).padStart(2,'0')}}
function stPause(){if(X.paused){X.paused=0;X.end=Date.now()+X.rem*1000;X.iv=setInterval(stTick,250)}else{X.rem=Math.ceil((X.end-Date.now())/1000);clearInterval(X.iv);X.paused=1}stDraw()}
function stNext(k){clearInterval(X.iv);X.run=0;X.paused=0;X.i=Math.max(0,X.i+k);if(X.i>=RT[X.d].length)stEnd();else stDraw()}
function stEnd(){clearInterval(X.iv);$('#st').style.display='none';finish(X.d)}
function inp(k,i,f,v){S.logs[k][i][f]=v;sv()}
function chk(k,i,n,rs){AC=AC||new(window.AudioContext||window.webkitAudioContext)();const s=S.logs[k][i];s.k=s.k?0:1;
if(s.k){const nx=S.logs[k][i+1];if(nx&&!nx.w&&s.w)nx.w=s.w;if(!s.d)start(rs,n);wl()}sv();const y=scrollY;render();scrollTo(0,y);if(s.k&&tab!='W'&&!S.pr[S.wk+'|'+tab]&&reqDone(S.wk,tab)){S.pr[S.wk+'|'+tab]=1;sv();coolAsk(tab)}}
function deldrop(k,i){S.logs[k].splice(i,1);sv();const y=scrollY;render();scrollTo(0,y)}
function drop(k){S.logs[k].push({w:'',r:'',k:0,d:1});sv();const y=scrollY;render();scrollTo(0,y)}
let AC,T={},WL;async function wl(){try{WL=await navigator.wakeLock.request('screen')}catch(e){}}
function start(sec,n){clearInterval(T.iv);T={n,b:sec,end:Date.now()+sec*1000};$('#tm').style.display='flex';$('#tm').className='';T.iv=setInterval(tick,250);tick()}
function tick(){const r=Math.ceil((T.end-Date.now())/1000),m=$('#tm');if(r<=0&&m.className!='go'){m.className='go';beep();setTimeout(()=>{if(m.className=='go')stop()},6000)}
const v=Math.max(0,r);m.innerHTML=`<div class="t">${Math.floor(v/60)}:${String(v%60).padStart(2,'0')}<small>${m.className=='go'?'GO – next set':T.n}</small></div><button class="btn" onclick="adj(-15)">−15</button><button class="btn" onclick="adj(15)">+15</button><button class="btn" onclick="stop()">Skip</button>`}
function adj(d){T.end+=d*1000;T.b=Math.max(15,T.b+d);S.rest[T.n]=T.b;sv();$('#tm').className='';tick()}
function stop(){clearInterval(T.iv);$('#tm').style.display='none'}
function beep(){try{[0,.25,.5].forEach(t=>{const o=AC.createOscillator(),g=AC.createGain();o.connect(g);g.connect(AC.destination);o.frequency.value=880;g.gain.setValueAtTime(.3,AC.currentTime+t);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+t+.2);o.start(AC.currentTime+t);o.stop(AC.currentTime+t+.22)})}catch(e){}navigator.vibrate&&navigator.vibrate([200,100,200])}
function info(n){const x=(I[n]||'No card yet|| ').split('|'),c=x[0].split(';');$('#sb').innerHTML=`<h3>${n}</h3><h4>Cues</h4><ul>${c.map(t=>`<li>${t}</li>`).join('')}</ul><h4>Common mistake</h4>${x[1]||''}<h4>Progression</h4>${x[2]||''}<p style="color:var(--mu);font-size:12px;margin-top:14px">Full setup and safety notes are in the program document.</p>`;$('#sheet').style.display='flex'}
const NV=[['home','🏠','Home'],['wo','🏋️','Workout'],['wk','📅','Weeks'],['log','📈','Log'],['guide','ℹ️','Guide']];let v='home';
function go(k,d){v=k;scrollTo(0,0);render();if(d){const a=$('#app');a.style.animation='none';a.offsetWidth;a.style.animation=(d>0?'slL':'slR')+' .2s ease-out'}}
const ORD=['home','wo','wk','log','guide'];let tx=0,ty=0,tg=null;
document.addEventListener('touchstart',e=>{const t=e.touches[0];tx=t.clientX;ty=t.clientY;tg=e.target.closest('input,textarea,select,#sheet,#tm,#st')},{passive:true});
document.addEventListener('touchend',e=>{if(tg||$('#sheet').style.display=='flex')return;const t=e.changedTouches[0],dx=t.clientX-tx,dy=t.clientY-ty;if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.6){const i=ORD.indexOf(v)+(dx<0?1:-1);if(i>=0&&i<ORD.length)go(ORD[i],dx<0?1:-1)}},{passive:true});
function render(){$('#nav').innerHTML=NV.map(x=>`<button class="${v==x[0]?'on':''}" onclick="go('${x[0]}')"><span>${x[1]}</span>${x[2]}</button>`).join('');const t=$('#tabs');t.style.display=v=='wo'?'flex':'none';if(v!='wo')t.innerHTML='';$('#wk').style.display=(v=='wo'||v=='home')?'':'none';$('#app').innerHTML=({home,wk:weeks,log:logv,guide,wo:workout})[v]()}
function home(){const w=S.wk,p=ph(w),td={1:'A',2:'B',3:'W',4:'C',5:'D'}[dow];
return`<div class="card"><h2 style="margin:0 0 4px;color:var(--ac)">Forge</h2><div class="mu">A 12-week recomposition program: build muscle and strength while staying lean. Four lifting days plus one 20-minute HIIT ride each week, about 45 minutes per session.</div></div>
<div class="card"><div class="meta">This week</div><div class="nm">Week ${w} · ${p.nm}</div><div class="mu">${BL[p.nm]}</div><button class="btn" style="margin-top:8px" onclick="tab='${td||'A'}';go('wo')">${td?'Open today’s session':'Open Monday’s session'}</button></div>
<div class="card"><div class="nm">Weekly schedule</div>${[['Mon','A','Upper push / pull'],['Tue','B','Lower + core'],['Wed','W','Peloton HIIT'],['Thu','C','TRX full body'],['Fri','D','Upper heavy']].map(x=>`<div class="mu" style="padding:4px 0" onclick="tab='${x[1]}';go('wo')"><b>${x[0]}</b> · ${x[2]}</div>`).join('')}<div class="mu">Sat / Sun: rest</div></div>
<div class="card"><div class="nm">How it works</div><ul class="ul"><li>Check off a set to start the rest timer. Adjust it ±15 s and the change is remembered.</li><li>Every set has its own weight and reps. Lower a set if you need to.</li><li>Tap an exercise name for cues, the top mistake and progression.</li><li>Start with Week 0 to find your loads, then follow Weeks 1-12.</li><li>Log body weight and weekly check-ins in the Log tab.</li><li>Swipe left or right to move between sections.</li><li>Finish a workout to see how many Giant Pandas you lifted.</li></ul></div>`}
function dn(w){return['A','B','C','D'].filter(d=>Object.keys(S.logs).some(k=>k.startsWith(w+'|'+d+'|')&&S.logs[k].some(s=>s.k))).length}
function weeks(){return'<div class="note">Tap a week to open it.</div>'+Array.from({length:13},(_,w)=>{const p=ph(w);return`<div class="card ${w==S.wk?'cur':''}" onclick="S.wk=${w};sv();$('#wk').value=${w};go('wo')"><div class="h"><span class="cd">${w}</span><span class="nm">${p.nm}</span><span class="meta">${dn(w)}/4 sessions</span></div><div class="mu">${BL[p.nm]}${DSW.includes(w)?' Drop sets on.':''}${w==11?' Retest week.':''}</div>${pbtn(w)}</div>`}).join('')}
function sess(){const m={};Object.keys(S.logs).forEach(k=>{const a=k.split('|'),n=S.logs[k].filter(x=>x.k).length;if(n)m[a[0]+'|'+a[1]]=(m[a[0]+'|'+a[1]]||0)+n});return Object.keys(m).sort((a,b)=>{const x=a.split('|'),y=b.split('|');return y[0]-x[0]||y[1].localeCompare(x[1])}).slice(0,8).map(q=>{const a=q.split('|');return`<div class="mu">Wk ${a[0]} · ${DAYS[a[1]].n} ${DAYS[a[1]].t}: ${m[q]} sets checked</div>`}).join('')||'<div class="mu">No sessions yet.</div>'}
function logv(w){const B=S.bw,td=new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10),c=S.ci[w]||{},f=(k,l)=>`<div><label>${l}</label><input inputmode="decimal" value="${c[k]||''}" onchange="ci(${w},'${k}',this.value)"></div>`;
const tr=B.length>1?`<div class="hint">Latest ${B[B.length-1].v} lb · ${(B[B.length-1].v-B[0].v>=0?'+':'')+(B[B.length-1].v-B[0].v).toFixed(1)} lb since ${B[0].d}</div>`:'';
const ch=Object.keys(S.ci).sort((a,b)=>a-b).map(k=>`<div class="mu">Wk ${k}: waist ${S.ci[k].wa||'–'} · RHR ${S.ci[k].hr||'–'} · shoulder ${S.ci[k].sh||'–'}/10${S.ci[k].nt?' · '+S.ci[k].nt:''}</div>`).join('');
return`<div class="card"><div class="nm">Body weight</div><div class="row2"><div><label>Weight (lb)</label><input id="bwv" inputmode="decimal"></div><div><label>Date</label><input id="bwd" type="date" value="${td}"></div></div><button class="btn" style="margin-top:8px" onclick="addbw()">Save weight</button>${tr}${B.slice(-8).reverse().map(x=>`<div class="mu">${x.d} · ${x.v} lb <span onclick="delbw('${x.d}')" style="float:right;color:var(--dr)">✕</span></div>`).join('')}</div>
<div class="card"><div class="nm">Week ${w} check-in</div><div class="row2">${f('wa','Waist (in)')}${f('hr','Resting HR')}${f('sh','Shoulder 0-10')}</div><label>Notes (sleep, soreness, energy)</label><textarea style="width:100%" rows="2" onchange="ci(${w},'nt',this.value)">${c.nt||''}</textarea>${ch}</div>
${pandaCard()}<div class="card"><div class="nm">Recent sessions</div>${sess()}</div>`}
function addbw(){const x=parseFloat($('#bwv').value),d=$('#bwd').value;if(!x||!d)return;S.bw=S.bw.filter(y=>y.d!=d);S.bw.push({d,v:x});S.bw.sort((a,b)=>a.d.localeCompare(b.d));sv();render()}
function delbw(d){S.bw=S.bw.filter(y=>y.d!=d);sv();render()}
function guide(){return`<div class="card"><div class="nm">Rest</div><div class="mu">60 s after heavy lifts, 45 s moderate, 30 s isolation, TRX and core. Adjust the timer ±15 s when needed.</div></div>
<div class="card"><div class="nm">Tempo and RIR</div><div class="mu">Tempo is four numbers: seconds lowering, pause at the bottom, seconds lifting, hold at the top. RIR is reps left in the tank.</div></div>
<div class="card"><div class="nm">Drop sets (*)</div><div class="mu">Only on the exercises marked * in Weeks 6-7 and 9-11. After your last working set, lower the weight about 20% and continue to near failure with no rest. Log it with + Drop set; tap ✕ to remove one added by mistake.</div></div>
<div class="card"><div class="nm">Progression</div><div class="mu">Add the smallest weight jump when every set reaches the top of the rep range at the target RIR. After you finish an exercise, the app shows a tip: add weight, stay at this weight, or repeat and lower it if you fall below the range. If weights are maxed: slow the lowering, add a pause, go single-limb, or add band tension.</div></div>
<div class="card"><div class="nm">Phases</div><ul class="ul"><li>Week 0: calibrate loads, no failure</li><li>Weeks 1-3: Foundation</li><li>Week 4: Reset (one fewer set)</li><li>Weeks 5-7: Build (drop sets from Week 6)</li><li>Week 8: Reset</li><li>Weeks 9-11: Peak (Week 11 retest)</li><li>Week 12: Deload</li></ul></div>
<div class="card"><div class="nm">Cool-down stretch</div><div class="mu">After your last exercise, tap Finish workout and then Start stretch (about 3 min). Tap GO for each stretch. Side stretches beep to switch sides. Stretch to mild tension, never pain. TRX stretches have a no-TRX alternative in the cue.</div></div>
<div class="card"><div class="nm">Short on time</div><div class="mu">Skip in this order: optional work, the Thursday finisher, then shorten the ab block. Tired week? Cut Thursday’s TRX chest fly, optional pairs, then one set from each isolation exercise.</div></div>
<div class="card"><div class="nm">Backup</div><div class="mu">Data is stored on this phone only. Export regularly.</div><button class="btn" style="margin-top:8px" onclick="exp()">Export</button> <label class="btn" style="display:inline-block">Import<input type="file" accept=".json" hidden onchange="imp(this.files[0])"></label></div>`}
function ci(w,k,v){(S.ci[w]=S.ci[w]||{})[k]=v;sv()}
function exp(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='forge-backup.json';a.click()}
function imp(f){const r=new FileReader();r.onload=()=>{try{S=JSON.parse(r.result);sv();render()}catch(e){alert('Invalid file')}};r.readAsText(f)}
$('#wk').innerHTML=Array.from({length:13},(_,i)=>`<option value="${i}">Week ${i}${i==0?' (calibrate)':''}</option>`).join('');$('#wk').value=S.wk;$('#wk').onchange=e=>{S.wk=+e.target.value;sv();render()};
render();if('serviceWorker'in navigator)navigator.serviceWorker.register('service-worker.js');
</script></body></html>
