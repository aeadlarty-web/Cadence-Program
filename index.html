const EX={"Weighted Dips (belt)":["Day A  •  Reps 6-10  •  Rest 60 s  •  Required","Primary: chest (sternal), triceps. Secondary: front delts. Emphasis shifts with torso angle, see cues.","Attach a plate or dumbbell to the dip belt. Grip the bars just outside shoulder width, lift to a locked-out support with shoulders pulled down, and cross or bend the legs behind you.","1) Start in a full support, ribs stacked over hips. 2) Lower under control until the upper arm is about parallel to the floor or the shoulder feels comfortable, whichever comes first. 3) Press the bars down and back up to a full elbow lockout without shrugging. 4) Pause one second at the top before the next rep.",["Upright torso with elbows tucked close to the ribs shifts more work to the triceps.","Forward torso lean (about 20-30° ahead of vertical) with elbows flared slightly wider shifts more work to the chest.","Pick one style for the whole 12 weeks so loads stay comparable. Chest-biased is the default here.","Stop where the front of the shoulder stays comfortable. Anatomy and shoulder mobility set your depth; deeper is not better.","Keep shoulders down and back, not rolled forward, and keep the neck long."],"3-0-1-1: 3 s lowering, no pause at the bottom, 1 s lifting, 1 s hold at the top.","Inhale on the way down, brace, exhale as you press up.",["Dropping too deep with shoulders rolled forward → Stop at about 90° of elbow bend or earlier and keep the chest lifted","Swinging or kipping with the belt weight → Slow the lowering to 3 seconds and reduce the load","Changing lean every set → Choose a lean angle before set one and repeat it"],"Add 2.5-5 lb on the belt when all sets reach 10 reps with the target RIR. Then slow the lowering, add a pause, or add a rep before adding more load.","Your shoulder can flare, so stop at the first pinching or pain. Replace with TRX Chest Press for the session if it does not settle. Check the belt chain and clip before every session."],"Weighted Pull-ups (belt)":["Day A  •  Reps 5-8  •  Rest 60 s  •  Required","Primary: lats. Secondary: biceps, mid-back, lower traps, forearms. A wider grip biases the lats; a neutral grip is friendlier to shoulders and elbows.","Overhand grip slightly wider than shoulders, thumbs wrapped. Hang with the belt weight and your shoulders pulled down and slightly back, legs crossed behind you.","1) Start from a controlled hang with shoulders engaged. 2) Drive your elbows down toward your ribs and pull your chest toward the bar. 3) Reach chin over the bar without craning the neck. 4) Hold one second at the top. 5) Lower for three seconds to a full hang.",["Think elbows to hips, not chin to bar.","Keep ribs down and avoid arching the lower back.","Pause one second at the top and feel the lats squeeze.","Control the lowering fully, down to straight arms.","Keep the legs still; no swing."],"3-0-1-1: 3 s lowering, no pause at the bottom, 1 s lifting, 1 s hold at the top.","Inhale in the hang, exhale as you pull.",["Half reps and dropping from the top → Lower for three seconds to a full hang every rep","Shrugging into the ears at the bottom → Pull shoulders down before each rep starts","Kicking or swinging to finish reps → Cut the load or reps until the movement is strict"],"Add 2.5-5 lb on the belt when all sets reach 8 reps. When weight options run out, add a 3-second pause at the top or bottom, or add reps.","Do not let the shoulders hang passively with a heavy belt. Use a controlled dead hang only. Stop if the elbows or the shoulder pinch."],"Incline DB Press":["Day A  •  Reps 8-12  •  Rest 45 s  •  Required","Primary: upper chest. Secondary: front delts, triceps.","Set the bench to 30-45°. Sit with dumbbells on thighs, kick them up, and lie back with shoulder blades pinched together and feet planted.","1) Press the dumbbells up over the upper chest. 2) Lower for three seconds until the elbows are slightly below the bench line. 3) Pause one second in the stretch. 4) Press back up without banging the dumbbells together.",["Keep shoulder blades pinned back and down.","Elbows about 45-60° from the torso, not flared to 90°.","Forearms stay vertical under the dumbbells.","Feel the stretch across the upper chest at the bottom.","Wrists stacked over elbows."],"3-1-1-0: 3 s lowering, 1 s pause at the bottom, 1 s lifting, no hold at the top.","Inhale on the way down, exhale on the press.",["Bench too steep, turning it into a shoulder press → Lower the bench angle to 30-45°","Flaring elbows wide → Tuck to about 45-60°","Bouncing out of the bottom → Pause one second and press smoothly"],"Add the smallest weight jump when all sets reach 12 reps. If dumbbells are maxed, use a slower 4-second lowering, add a pause, or move to single-arm sets.","Use a spotter or set the dumbbells down on your thighs to exit. Stop if the shoulder pinches and lower the bench angle."],"TRX Inverted Row":["Day A  •  Reps 10-15  •  Rest 45 s  •  Required","Primary: mid-back and rhomboids. Secondary: lats, rear delts, biceps.","Adjust the handles to about chest height when standing. Hold the handles, walk the feet forward and lean back until arms are straight and the body is a straight line.","1) Start with arms extended and ribs down. 2) Pull the handles toward the sides of the ribs. 3) Squeeze the shoulder blades together for two seconds. 4) Lower for two seconds.",["Keep the body as a straight plank.","Lead with the elbows, not the hands.","Pull shoulder blades together at the top.","Keep the neck neutral.","Palms face each other or slightly down."],"2-0-1-2: 2 s lowering, no pause at the bottom, 1 s lifting, 2 s hold at the top.","Exhale as you pull, inhale as you lower.",["Hips sagging → Squeeze the glutes and brace the core","Shrugging shoulders → Press them down before pulling","Using body momentum → Slow the lowering to 2 seconds"],"Walk the feet forward to lower the angle, then elevate the feet on a box. Add a one-second top hold or switch to one arm.","Check the TRX anchor point and straps before each use, and keep the straps from twisting on the bar."],"DB Lateral Raise":["Day A  •  Reps 12-15  •  Rest 30 s  •  Required","Primary: lateral (middle) deltoid. Secondary: upper traps, supraspinatus.","Stand with a slight knee bend and a dumbbell in each hand at your sides, elbows softly bent.","1) Raise the arms out to the sides leading with the elbows. 2) Stop with the upper arm about parallel to the floor, slightly in front of the body plane. 3) Hold one second. 4) Lower over three seconds.",["Lead with the elbows, not the hands.","Keep a small, fixed bend in the elbows.","Do not shrug the shoulders.","Raise in a slightly forward plane (scapular plane).","Keep the dumbbells slightly lower than the elbows."],"3-0-1-1: 3 s lowering, no pause at the bottom, 1 s lifting, 1 s hold at the top.","Exhale as you raise, inhale as you lower.",["Swinging the torso → Lower the weight and brace the core","Raising above shoulder height with shrugging → Stop at shoulder height","Dropping the weight quickly → Take three seconds down"],"Add the smallest dumbbell jump at 15 reps on all sets. Use drop sets only in Weeks 6-7 and 9-11 on the marked set. If dumbbells jump too far, slow the tempo or add a pause.","Keep the weight light enough that the shoulder never pinches. Use a thumbs-slightly-up grip if that is more comfortable."],"TRX Face Pull":["Day A  •  Reps 12-15  •  Rest 30 s  •  Required","Primary: rear delts and mid-traps. Secondary: rotator cuff external rotators.","Set handles at about head height, lean back with arms extended and palms facing each other, feet forward.","1) Pull the hands toward the forehead, elbows high and wide. 2) Rotate the hands outward at the end so the knuckles face the ceiling. 3) Hold for two seconds. 4) Lower over two seconds.",["Elbows stay high, at or above the hands.","Pull to the forehead, not the chest.","Finish with external rotation.","Keep ribs down; do not arch.","Move slowly to keep the shoulder blades involved."],"2-0-1-2: 2 s lowering, no pause at the bottom, 1 s lifting, 2 s hold at the top.","Exhale as you pull, inhale as you return.",["Pulling to the chest like a row → Pull higher to the forehead with elbows high","Leaning back with momentum → Walk the feet back and slow the tempo","Shrugging → Depress the shoulders first"],"Walk the feet forward to increase the load, or add a longer pause at the end.","Check the TRX anchor and straps. This is the main posterior shoulder exercise and helps keep your shoulder balanced against the pressing."],"Hammer Curl":["Day A  •  Reps 10-15  •  Rest 30 s  •  OPTIONAL","Primary: brachialis and brachioradialis. Secondary: biceps, forearms.","Stand tall, dumbbells at sides with palms facing each other.","1) Curl both dumbbells up with the thumbs pointing up. 2) Squeeze for one second at the top. 3) Lower over three seconds to a full stretch.",["Pin the elbows by your sides.","Keep the wrists neutral.","Do not swing the torso.","Lower slowly to full extension.","Stand tall with ribs down."],"3-0-1-1: 3 s lowering, no pause at the bottom, 1 s lifting, 1 s hold at the top.","Exhale as you curl, inhale as you lower.",["Swinging → Reduce the weight and brace the core","Elbows drifting forward → Keep the elbows beside the ribs","Short range → Lower to full extension each rep"],"Add reps to 15, then add the smallest weight jump. Switch to a Band Biceps Curl in Week 9 for a different resistance profile.","Optional work. Keep the wrists straight and the grip relaxed."],"TRX Triceps Extension":["Day A  •  Reps 10-15  •  Rest 30 s  •  OPTIONAL","Primary: triceps, long head when the arms are overhead. Secondary: core stability.","Face away or toward the anchor at about chest height, hands on the handles in front of you, body leaning forward in a straight line.","1) Start with elbows bent and hands by the forehead. 2) Press the handles forward until the arms are straight. 3) Squeeze for one second. 4) Lower under control.",["Keep elbows fixed and pointing forward.","Body stays in a straight plank.","Fully lock out the elbows.","Do not let the lower back sag.","Walk the feet closer to the anchor to make it harder."],"3-0-1-1: 3 s lowering, no pause at the bottom, 1 s lifting, 1 s hold at the top.","Exhale as you press, inhale as you lower.",["Elbows flaring wide → Keep them forward and narrow","Sagging hips → Brace the glutes and core","Using momentum → Slow the lowering to 3 seconds"],"Walk the feet further away to make the angle harder, add reps, or add a pause.","Optional work. Replaced by the Band Overhead Triceps Extension at Week 5. Stop if the elbows ache."],"Band Overhead Triceps Extension":["Day A (from Week 5)  •  Reps 12-15  •  Rest 30 s  •  OPTIONAL","Primary: triceps long head. Secondary: core.","Anchor a heavy band low behind you or stand on it. Hold the band behind the head with both hands, elbows pointing forward, one foot ahead for balance.","1) Start with elbows by the ears and the band taut. 2) Extend the elbows to lock out overhead. 3) Hold one second. 4) Return over three seconds.",["Elbows stay close to the head.","Keep the ribs down; do not arch.","Band tension rises through the range; finish hard.","Use a wide stance for stability.","Keep the wrists straight."],"3-1-1-1: 3 s lowering, 1 s pause at the bottom, 1 s lifting, 1 s hold at the top.","Exhale as you extend, inhale as you return.",["Elbows flaring → Pull them in toward the ears","Arching the lower back → Brace the abs and tuck the ribs","Band slipping → Re-anchor and test it before each set"],"Use a heavier band, step further from the anchor, or add reps. Band resistance cannot be compared with dumbbell weight; track the band color and your step distance.","Inspect the band for nicks before each session. Anchor it securely and never let it snap back loose. Optional work."],"DB Front Squat (racked)":["Day B  •  Reps 8-12  •  Rest 60 s  •  Required","Primary: quadriceps. Secondary: glutes, core, upper back.","Hold two dumbbells racked on the front of the shoulders with palms facing in. Feet shoulder-width, toes slightly out.","1) Brace and keep the elbows up. 2) Sit down between the hips to at least parallel with the knees tracking over the toes. 3) Pause one second in the hole. 4) Drive up through the mid-foot.",["Upright torso with elbows up.","Knees travel over the toes.","Heels stay flat.","Brace the abs before every rep.","Drive the floor away."],"3-1-1-0: 3 s lowering, 1 s pause at the bottom, 1 s lifting, no hold at the top.","Inhale and brace at the top, exhale as you stand.",["Torso falling forward → Lighten the load and keep elbows up","Heels lifting → Widen the stance or elevate heels slightly","Dropping fast → Lower in 3 seconds"],"Add the smallest weight jump when all sets reach 12 reps. With dumbbells maxed, add a pause, slow the lowering to 4 seconds, or move toward single-leg work.","Set the dumbbells down rather than dropping them. Stop short of any knee pain."],"L-Sit (p-bars)":["Day B  •  Reps 10-20 s  •  Rest 30 s  •  Required","Primary: hip flexors and rectus abdominis. Secondary: triceps, front delts, lats.","Place the p-bars shoulder-width apart, press up into a support with arms locked and shoulders down.","1) Press down through the bars and lift the legs forward, knees tucked if needed. 2) Straighten the legs as strength allows. 3) Hold for the prescribed seconds. 4) Lower the legs with control.",["Press the shoulders down away from the ears.","Keep the chest tall.","Point or flex the toes.","Keep the legs together.","Breathe steadily; do not hold the breath."],"Isometric hold for the prescribed seconds.","Take short, steady breaths while holding.",["Shoulders shrugging up → Push the bars down and lengthen the neck","Legs dropping → Tuck the knees or use shorter holds","Leaning back → Lean slightly forward and brace the abs"],"Tuck hold, then one leg straight, then both legs straight. Add 2-3 seconds each week.","Make sure the bars are stable. Stop if the wrists or shoulders hurt."],"DB Romanian Deadlift":["Day B  •  Reps 8-12  •  Rest 60 s  •  Required","Primary: hamstrings and glutes. Secondary: spinal erectors, forearms.","Stand with feet hip-width apart, dumbbells in front of the thighs, knees softly bent.","1) Push the hips back while lowering the dumbbells along the thighs. 2) Lower for three seconds until a firm hamstring stretch. 3) Pause one second. 4) Drive the hips forward and squeeze the glutes at the top for one second.",["Hips back, not down.","Keep dumbbells close to the legs.","Neutral spine.","Soft knees, shins mostly vertical.","Squeeze the glutes at lockout."],"3-1-1-1: 3 s lowering, 1 s pause at the bottom, 1 s lifting, 1 s hold at the top.","Inhale and brace on the way down, exhale as you stand.",["Rounding the lower back → Reduce the range and brace harder","Squatting the movement → Push the hips back more","Hyperextending at the top → Stop when hips are fully forward"],"Add the smallest weight jump when all sets reach 12 reps. If dumbbells are maxed, slow the lowering, add a pause, or use a single-leg version.","Stop if the lower back strains. Keep the dumbbells close."],"Ab Wheel Rollout":["Day B  •  Reps 8-12  •  Rest 30 s  •  Required","Primary: abs and deep core (anti-extension). Secondary: lats, shoulders.","Kneel on a pad with the wheel under the shoulders, hips slightly tucked.","1) Tuck the pelvis and roll out slowly. 2) Stop where you can still hold a flat back. 3) Pause one second. 4) Pull back with the abs.",["Ribs down, glutes tight.","Move from the shoulders, not the hips.","Short range beats a long sagging one.","Eyes slightly forward.","Pull back with the abs, not the arms."],"3-1-1-0: 3 s lowering, 1 s pause at the bottom, 1 s lifting, no hold at the top.","Exhale as you roll out, inhale as you return.",["Lower back sagging → Shorten the range","Hips piking → Keep a straight line","Rolling too fast → Take three seconds out"],"Increase the roll-out range, add a pause, or elevate the start with a slight incline.","Stop if the lower back hurts. Use a pad under the knees."],"Bulgarian Split Squat":["Day B  •  Reps 8-10/leg  •  Rest 45 s  •  Required","Primary: quads and glutes. Secondary: adductors, core.","Rear foot on a bench, front foot about two feet ahead. Dumbbells at sides.","1) Lower straight down for three seconds. 2) Front thigh near parallel. 3) Pause one second. 4) Drive up through the front heel.",["Torso slightly forward to bias glutes, upright to bias quads.","Front knee tracks over the toes.","Weight on the front foot.","Move straight up and down.","Keep the hips square."],"3-1-1-0: 3 s lowering, 1 s pause at the bottom, 1 s lifting, no hold at the top.","Inhale down, exhale up.",["Stance too short → Step further out","Pushing off the rear foot → Keep weight on the front leg","Knee collapsing in → Push the knee out"],"Add the smallest weight jump at 10 reps, or add a pause, or slow the lowering.","Use a sturdy bench. Stop short of any knee pain."],"TRX Hamstring Curl":["Day B  •  Reps 10-15  •  Rest 30 s  •  Required","Primary: hamstrings. Secondary: glutes, calves.","Lie on your back with the heels in the TRX foot cradles and hips lifted.","1) Raise the hips. 2) Curl the heels toward the glutes. 3) Squeeze for two seconds. 4) Extend slowly.",["Keep the hips high.","Squeeze the glutes.","Pull with the heels.","Keep the body in a straight line.","Control the extension."],"2-0-1-2: 2 s lowering, no pause at the bottom, 1 s lifting, 2 s hold at the top.","Exhale as you curl, inhale as you extend.",["Hips dropping → Lift and squeeze the glutes","Short range → Extend fully each rep","Rushing → Take two seconds each way"],"Progress to the single-leg version at Week 9.","Check the TRX straps. Stop for any hamstring cramp that does not ease."],"TRX Single-Leg Hamstring Curl":["Day B (from Week 9)  •  Reps 8-12/leg  •  Rest 30 s  •  Required","Primary: hamstrings. Secondary: glutes, core.","Lie on your back with one heel in the strap and hips lifted. The other leg is held straight up.","1) Raise the hips. 2) Curl the working heel toward the glutes. 3) Squeeze for two seconds. 4) Extend slowly.",["Hips stay level.","Squeeze the glute.","Do not rotate.","Slow extension.","Keep the free leg still."],"2-0-1-2: 2 s lowering, no pause at the bottom, 1 s lifting, 2 s hold at the top.","Exhale as you curl, inhale as you extend.",["Hips rotating → Square the hips and reduce the range","Hips dropping → Raise them and squeeze","Using momentum → Slow both phases"],"Add reps, add a pause, or slow the extension.","Same checks as the two-leg curl. Reduce the range if a hamstring cramps."],"Single-Leg Calf Raise (DB)":["Day B  •  Reps 15-20  •  Rest 30 s  •  Required","Primary: gastrocnemius and soleus.","Stand on one foot on a step edge, holding a dumbbell in the same-side hand and a support with the other.","1) Lower the heel for three seconds to a full stretch. 2) Pause two seconds. 3) Rise onto the toes. 4) Hold one second at the top.",["Full stretch at the bottom.","Rise straight up.","Keep the knee extended.","Do not bounce.","Hold the top for one second."],"3-2-1-1: 3 s lowering, 2 s pause at the bottom, 1 s lifting, 1 s hold at the top.","Exhale up, inhale down.",["Bouncing → Pause in the stretch","Partial range → Use a full range","Rolling to the outside of the foot → Push through the big toe"],"Add reps to 20, then add weight. Drop sets only in Weeks 6-7 and 9-11.","Use a stable support. Required work every week."],"DB Hip Thrust":["Day B  •  Reps 10-15  •  Rest 45 s  •  Required","Primary: glutes. Secondary: hamstrings.","Upper back against a bench, dumbbell across the hips, feet flat and shoulder-width apart.","1) Drive the hips up. 2) Squeeze the glutes for two seconds at the top. 3) Lower under control.",["Chin tucked.","Ribs down.","Push through the heels.","Stop with the torso flat.","Do not overextend the lower back."],"2-0-1-2: 2 s lowering, no pause at the bottom, 1 s lifting, 2 s hold at the top.","Exhale as you thrust, inhale as you lower.",["Overarching the lower back → Tuck the ribs and finish with a flat torso","Feet too far from the hips → Walk them closer","Rushing → Squeeze for two seconds"],"Add weight, pause longer, or go single-leg.","Pad the dumbbell. Keep the bench stable."],"TRX Chest Press":["Day C  •  Reps 10-15  •  Rest 45 s  •  Required","Primary: chest. Secondary: front delts, triceps, core.","Face away from the anchor, handles at chest height, body leaning forward in a straight line, feet hip-width.","1) Start with elbows bent about 45° from the torso. 2) Press the handles forward and slightly together until the arms are straight. 3) Lower for three seconds with a one-second pause at the bottom.",["Keep the body in a straight plank.","Elbows 45° from the torso.","Squeeze the chest at lockout.","Shoulder blades stay set.","Walk the feet back to make it easier, forward to make it harder."],"3-1-1-0: 3 s lowering, 1 s pause at the bottom, 1 s lifting, no hold at the top.","Inhale as you lower, exhale as you press.",["Hips piking or sagging → Brace the glutes and abs","Elbows flaring → Keep them at about 45°","Shoulders rolling forward → Keep the shoulder blades set"],"Walk the feet forward or elevate the feet. Add a pause, add reps, or move to a single-arm version.","Check the anchor and straps. If the shoulder pinches, shorten the range."],"TRX Single-Arm Row":["Day C  •  Reps 8-12/arm  •  Rest 45 s  •  Required","Primary: mid-back and lats. Secondary: biceps, core (anti-rotation).","Hold one handle with a staggered stance and lean back with the free hand on the hip.","1) Pull the elbow toward the hip. 2) Squeeze for two seconds. 3) Lower slowly while resisting rotation.",["Keep the hips and shoulders square.","Elbow close to the body.","Squeeze the shoulder blade back.","Straight body line.","Control the lowering."],"2-0-1-2: 2 s lowering, no pause at the bottom, 1 s lifting, 2 s hold at the top.","Exhale as you pull, inhale as you lower.",["Rotating the torso → Slow down and brace the core","Shrugging → Depress the shoulder first","Using the legs → Keep the feet planted"],"Walk the feet forward, add a pause, or elevate the feet.","Check anchor and straps. Switch sides evenly."],"DB Reverse Lunge":["Day C  •  Reps 8-10/leg  •  Rest 45 s  •  Required","Primary: quads and glutes. Secondary: hamstrings, core.","Stand tall holding dumbbells at your sides.","1) Step back about two feet. 2) Lower the back knee toward the floor for three seconds. 3) Push through the front foot to return.",["Upright chest.","Front knee over the foot.","Long step back.","Control the lowering.","Drive through the front heel."],"3-0-1-0: 3 s lowering, no pause at the bottom, 1 s lifting, no hold at the top.","Inhale down, exhale up.",["Short step → Take a longer step","Front knee collapsing → Push the knee out","Bouncing off the back knee → Touch lightly and pause"],"Add the smallest dumbbell jump at 10 reps per leg, or add a pause at the bottom.","Use a clear floor and lighter loads if balance is shaky."],"TRX Fallout":["Day C  •  Reps 8-12  •  Rest 30 s  •  Required","Primary: abs and deep core (anti-extension). Secondary: lats, front delts.","Face away from the anchor with handles at about hip height, arms extended in front.","1) Lean forward and move the arms overhead. 2) Stop where the body stays straight. 3) Pause one second. 4) Pull back using the abs.",["Ribs down.","Glutes tight.","Hands move forward and up.","Do not sag at the hips.","Short range if needed."],"3-1-1-0: 3 s lowering, 1 s pause at the bottom, 1 s lifting, no hold at the top.","Exhale as you move out, inhale as you return.",["Lower back sagging → Reduce the range","Bending at the hips → Keep a straight line","Rushing → Take three seconds out"],"Step the feet back, lengthen the lever, or add a pause.","Check the TRX anchor before each session."],"TRX Chest Fly":["Day C  •  Reps 10-15  •  Rest 45 s  •  Required","Primary: chest (stretch and adduction). Secondary: front delts.","Face away from the anchor, handles at chest height, arms out wide with a soft elbow bend, body in a straight line.","1) Lean forward and open the arms. 2) Lower into a stretch for three seconds. 3) Pause one second. 4) Hug the handles together and squeeze for one second.",["Keep a fixed soft elbow bend.","Hug a big tree.","Keep the body straight.","Stop at a comfortable shoulder stretch.","Squeeze the chest at the top."],"3-1-1-1: 3 s lowering, 1 s pause at the bottom, 1 s lifting, 1 s hold at the top.","Inhale as you open, exhale as you close.",["Bending and straightening the elbows → Keep the bend fixed","Opening too far → Stop at a comfortable stretch","Sagging hips → Brace the core"],"Walk the feet forward, add a pause, or elevate the feet.","This position loads the front of the shoulder. Stop at the first pinch."],"TRX Y-Raise":["Day C  •  Reps 10-15  •  Rest 30 s  •  Required","Primary: lower traps and rear delts. Secondary: lateral delts.","Face the anchor, handles at about waist height, lean back with arms straight.","1) Raise the arms into a Y overhead, thumbs up. 2) Hold for two seconds. 3) Lower slowly.",["Keep the arms straight.","Shoulders down.","Thumbs up.","Ribs down.","Slow lowering."],"2-0-1-2: 2 s lowering, no pause at the bottom, 1 s lifting, 2 s hold at the top.","Exhale as you raise, inhale as you lower.",["Shrugging → Depress the shoulders first","Arching the lower back → Brace the core","Bending the elbows → Keep the arms straight"],"Walk the feet forward, add a pause, or increase reps.","Keep the movement pain-free in the shoulder."],"TRX Single-Leg RDL":["Day C  •  Reps 8-10/leg  •  Rest 45 s  •  Required","Primary: hamstrings and glutes. Secondary: core balance.","Stand on one leg holding TRX handles lightly for balance.","1) Hinge forward while the free leg goes back. 2) Lower for three seconds. 3) Pause one second. 4) Drive the hip forward and squeeze for one second.",["Back flat.","Hips square.","Slight knee bend.","Light grip on the straps.","Squeeze the glute."],"3-1-1-1: 3 s lowering, 1 s pause at the bottom, 1 s lifting, 1 s hold at the top.","Inhale as you lower, exhale as you stand.",["Rotating the hips open → Keep them square","Rounding the back → Reduce the range","Pulling hard on the straps → Use the straps only for balance"],"Reduce strap assistance, add a pause, or hold a dumbbell.","Check the TRX straps. Alternate legs each set."],"TRX Squat":["Day C finisher (OPTIONAL)","Primary: quads, glutes. Secondary: core.","Face the anchor, holding the handles with arms extended.","1) Sit down into a squat. 2) Drive up with assistance from the straps. 3) Jump optional.",["Chest up.","Knees over toes.","Heels flat.","Control the lowering.","Use the straps lightly."],"Controlled lowering, fast lifting.","Inhale down, exhale up.",["Pulling hard on the straps → Use them lightly","Heels lifting → Widen the stance","Knees collapsing → Push the knees out"],"Add speed, add a jump, or reduce strap assistance.","Part of the optional Day C finisher. Check the straps."],"Weighted Chin-ups (belt)":["Day D  •  Reps 5-8  •  Rest 60 s  •  Required","Primary: lats and biceps. Secondary: mid-back, forearms.","Underhand grip about shoulder width, belt weight attached, hang with shoulders engaged.","1) Pull the chest toward the bar. 2) Hold one second at the top. 3) Lower for three seconds.",["Elbows to hips.","Chest to the bar.","Shoulders down.","Control the lowering.","No swinging."],"3-0-1-1: 3 s lowering, no pause at the bottom, 1 s lifting, 1 s hold at the top.","Exhale as you pull, inhale as you lower.",["Half reps → Lower to a full hang","Chin craning → Pull the chest up","Swinging → Strict reps and less load"],"Add 2.5-5 lb on the belt when all sets reach 8 reps. Add a pause if weights are limited.","The underhand grip is easier on the shoulders but loads the elbows. Stop if the elbows ache and switch to a neutral grip."],"DB Bench Press":["Day D  •  Reps 6-10  •  Rest 60 s  •  Required","Primary: chest. Secondary: triceps, front delts.","Lie on a flat bench with shoulder blades pinned back, dumbbells over the chest, feet planted.","1) Lower for three seconds to the chest line. 2) Pause one second. 3) Press back up.",["Shoulder blades pinned.","Elbows about 45° from the torso.","Wrists stacked over elbows.","Controlled lowering.","Press up and slightly together."],"3-1-1-0: 3 s lowering, 1 s pause at the bottom, 1 s lifting, no hold at the top.","Inhale as you lower, exhale as you press.",["Elbows flared wide → Tuck to about 45°","Bouncing → Pause briefly","Lifting the hips → Keep the glutes on the bench"],"Add the smallest weight jump when all sets reach 10 reps. If dumbbells are maxed, slow the lowering, add a pause, or try single-arm presses.","Set the dumbbells down on your thighs to exit. Stop if the shoulder pinches."],"One-Arm DB Row":["Day D  •  Reps 6-10  •  Rest 45 s  •  Required","Primary: lats and mid-back. Secondary: biceps, rear delts, forearms.","One hand and knee on a bench, the other hand holding the dumbbell with the back flat.","1) Pull the elbow toward the hip. 2) Hold one second. 3) Lower over two seconds.",["Flat back.","Pull to the hip.","Do not rotate the torso.","Control the lowering.","Neck neutral."],"2-1-1-1: 2 s lowering, 1 s pause at the bottom, 1 s lifting, 1 s hold at the top.","Exhale as you pull, inhale as you lower.",["Rotating the torso → Brace and slow down","Short range → Use a full stretch","Shrugging → Depress the shoulder first"],"Add the smallest weight jump at 10 reps. With dumbbells maxed, add a pause or slow the lowering.","Keep the back flat."],"Standing DB Overhead Press":["Day D  •  Reps 6-10  •  Rest 45 s  •  Required","Primary: front delts. Secondary: lateral delts, triceps, core.","Stand holding dumbbells at shoulder height, neutral grip is fine.","1) Press the dumbbells overhead. 2) Lock out with the biceps near the ears. 3) Lower for three seconds.",["Ribs down.","Glutes tight.","Bar path straight up.","Neutral rift → Lock them in place","Going too heavy → Lower the weight"],"Add reps, then the smallest weight jump. Drop sets only in Weeks 6-7 and 9-11.","Elbows take stress here after chin-ups. Stop at any sharp elbow pain."],"Incline DB Curl":["Day D  •  Reps 10-15  •  Rest 30 s  •  OPTIONAL","Primary: biceps long head. Secondary: forearms.","Sit on a bench set at about 45-60° with dumbbells hanging at your sides.","1) Curl up with the elbows staying behind the body. 2) Squeeze for one second. 3) Lower for three seconds to a full stretch with a pause.",["Elbows stay back.","Full stretch.","No swinging.","Supinate as you curl.","Control the lowering."],"3-1-1-0: 3 s lowering, 1 s pause at the bottom, 1 s lifting, no hold at the top.","Exhale as you curl, inhale as you lower.",["Elbows drifting forward → Keep them behind the body","Swinging → Slow down","Short range → Lower to full extension"],"Add reps to 15, then add the smallest weight jump.","Optional work. Keep shoulders relaxed."],"Band Lateral Raise":["Day D (from Week 5)  •  Reps 12-20  •  Rest 30 s  •  Required","Primary: lateral delts. Secondary: upper traps.","Stand on the middle of a band with a handle in each hand, arms at your sides.","1) Raise the arms out to the sides. 2) Hold one second at the top, where the band is tightest. 3) Lower over three seconds.",["Lead with elbows.","Keep a soft bend.","Do not shrug.","Raise slightly forward of the sides.","Feel the tension at the top."],"3-0-1-1: 3 s lowering, no pause at the bottom, 1 s lifting, 1 s hold at the top.","Exhale as you raise, inhale as you lower.",["Shrugging → Depress the shoulders","Band too heavy, causing swinging → Use a lighter band","Short range → Raise to shoulder height"],"Use a heavier band, shorten the grip on the band, or add reps. Band resistance rises through the range.","Inspect the band for nicks and stand on it securely."],"Band Face Pull":["Day D  •  Reps 15-20  •  Rest 30 s  •  OPTIONAL","Primary: rear delts, mid-traps. Secondary: rotator cuff.","Anchor a band at head height. Hold the ends and step back until there is tension.","1) Pull toward the forehead with elbows high. 2) Rotate the hands out at the end. 3) Hold for two seconds. 4) Return slowly.",["Elbows high.","Pull to the forehead.","Finish with external rotation.","Ribs down.","Slow return."],"2-0-1-2: 2 s lowering, no pause at the bottom, 1 s lifting, 2 s hold at the top.","Exhale as you pull, inhale as you return.",["Pulling to the chest → Pull higher","Leaning back → Stay tall","Shrugging → Depress the shoulders"],"Use a heavier band, or step back. Add a longer pause.","Optional work. Inspect the band and anchor it securely."],"Band Biceps Curl":["Day A (from Week 9)  •  Reps 12-15  •  Rest 30 s  •  OPTIONAL","Primary: biceps. Secondary: forearms.","Stand on a band with both feet, hands holding the ends, palms up.","1) Curl up. 2) Squeeze for one second at the top, where the band is tightest. 3) Lower over three seconds.",["Elbows by the sides.","No swinging.","Squeeze at the top.","Slow lowering.","Stand tall."],"3-0-1-1: 3 s lowering, no pause at the bottom, 1 s lifting, 1 s hold at the top.","Exhale as you curl, inhale as you lower.",["Swinging → Lighter band","Elbows drifting forward → Pin them","Short range → Full extension"],"Use a heavier band, stand wider, or add reps.","Optional work. Inspect the band for nicks."],"Hanging Knee Raise":["Ab block, 60 s (OPTIONAL)","Primary: lower abs, hip flexors. Secondary: grip.","Hang from the pull-up bar with shoulders engaged.","1) Curl the knees toward the chest by tilting the pelvis. 2) Lower slowly.",["Tilt the pelvis.","Do not swing.","Shoulders down.","Slow lowering.","Breathe steadily."],"Slow and controlled, 60 seconds nonstop (30 s per side on side planks).","Exhale as you raise, inhale as you lower.",["Swinging → Slow down","Hip flexor only → Curl the pelvis","Shrugging → Press shoulders down"],"Straighten the legs, move to Hanging Leg Raise.","Stop if grip fails. Core work."],"Dead Bug":["Ab block, 60 s (OPTIONAL)","Primary: deep core (anti-extension). Secondary: hip flexors.","Lie on your back, arms up and knees at 90°.","1) Lower opposite arm and leg slowly. 2) Keep the lower back flat. 3) Return and alternate.",["Lower back flat.","Slow.","Ribs down.","Opposite arm and leg.","Breathe out as you extend."],"Slow and controlled, 60 seconds nonstop (30 s per side on side planks).","Exhale as you extend, inhale as you return.",["Back arching → Shorten the range","Rushing → Slow down","Holding the breath → Exhale on extension"],"Add a light weight or longer reach.","Core work. Keep the neck relaxed."],"Plank":["Ab block, 60 s (OPTIONAL)","Primary: deep core. Secondary: glutes, shoulders.","Forearms on the floor, elbows under shoulders, legs extended.","1) Brace the abs and squeeze the glutes. 2) Hold a straight line.",["Ribs down.","Glutes tight.","Push the floor away.","Neutral neck.","Breathe."],"Slow and controlled, 60 seconds nonstop (30 s per side on side planks).","Short, steady breaths.",["Hips sagging → Squeeze the glutes","Hips piking → Lower them","Holding the breath → Breathe slowly"],"Add time or move to an RKC plank.","Stop if the lower back hurts. Core work."],"Reverse Crunch":["Ab block, 60 s (OPTIONAL)","Primary: lower abs.","Lie on your back with knees bent and hands by your sides.","1) Curl the hips off the floor. 2) Lower slowly.",["Curl, do not swing.","Lower slowly.","Keep the neck relaxed.","Exhale up.","Small controlled movement."],"Slow and controlled, 60 seconds nonstop (30 s per side on side planks).","Exhale as you curl, inhale as you lower.",["Swinging the legs → Slow down","Pulling with the arms → Keep them relaxed","Neck strain → Relax the neck"],"Straighten the legs or add a pause.","Core work."],"Bicycle Crunch":["Ab block, 60 s (OPTIONAL)","Primary: obliques, rectus abdominis.","Lie on your back with hands lightly by the head.","1) Bring one knee and the opposite elbow together. 2) Alternate sides slowly.",["Rotate the ribs, not the elbows.","Slow.","Neck relaxed.","Extend the leg fully.","Lower back stays down."],"Slow and controlled, 60 seconds nonstop (30 s per side on side planks).","Exhale on each twist.",["Pulling the neck → Relax the hands","Rushing → Slow down","Arching the back → Lower the legs higher"],"Add a pause at each twist.","Core work."],"Side Plank":["Ab block, 60 s (OPTIONAL)","Primary: obliques, quadratus lumborum, glute medius.","Lie on your side with the elbow under the shoulder and legs stacked.","1) Lift the hips. 2) Hold a straight line.",["Hips high.","Straight line.","Shoulder stacked.","Breathe.","Squeeze the glutes."],"Slow and controlled, 60 seconds nonstop (30 s per side on side planks).","Short steady breaths.",["Hips dropping → Lift them","Rolling forward → Stack the shoulders","Holding the breath → Breathe"],"Add time or lift the top leg.","Core work. Hold 30 s each side in the circuit."],"Mountain Climbers":["Ab block, 60 s (OPTIONAL)","Primary: hip flexors, core. Secondary: shoulders, conditioning.","High plank with hands under shoulders.","1) Drive one knee toward the chest. 2) Alternate quickly.",["Hips low.","Hands under shoulders.","Core braced.","Fast but controlled.","Breathe."],"Slow and controlled, 60 seconds nonstop (30 s per side on side planks).","Steady, rhythmic breaths.",["Hips high → Lower them","Bouncing → Keep control","Holding the breath → Breathe"],"Increase pace or add time.","Core work and finisher. Keep the wrists comfortable."],"TRX Knee Tuck":["Ab block, 60 s (OPTIONAL)","Primary: lower abs, hip flexors. Secondary: shoulders.","Feet in the TRX cradles, hands on the floor in a high plank.","1) Pull the knees toward the chest. 2) Extend slowly back.",["Hips lifted.","Slow.","Shoulders stacked.","Core tight.","Control the return."],"Slow and controlled, 60 seconds nonstop (30 s per side on side planks).","Exhale as you tuck, inhale as you extend.",["Hips sagging → Squeeze the glutes","Rushing → Slow down","Shoulders collapsing → Push the floor away"],"Add a pike or slow the tempo.","Core work. Check the straps."],"Hollow Hold":["Ab block, 60 s (OPTIONAL)","Primary: abs. Secondary: hip flexors.","Lie on your back, arms overhead.","1) Lift the shoulders and legs slightly. 2) Press the lower back into the floor.",["Lower back flat.","Legs low only if the back stays flat.","Breathe.","Ribs down.","Neck neutral."],"Slow and controlled, 60 seconds nonstop (30 s per side on side planks).","Short steady breaths.",["Lower back arching → Raise the legs higher","Holding the breath → Breathe","Neck strain → Chin slightly tucked"],"Extend the arms and legs further or add time.","Core work."],"Hanging Leg Raise":["Ab block, 60 s (OPTIONAL)","Primary: lower abs, hip flexors. Secondary: grip, lats.","Hang from the pull-up bar with shoulders engaged.","1) Raise straight legs while curling the pelvis. 2) Lower slowly.",["Tilt the pelvis.","No swinging.","Shoulders down.","Slow lowering.","Straight legs if possible."],"Slow and controlled, 60 seconds nonstop (30 s per side on side planks).","Exhale as you raise, inhale as you lower.",["Swinging → Slow down","Legs bending → Use knee raises","Shrugging → Depress the shoulders"],"Raise toward the bar, or add a pause.","Core work. Stop if grip fails."],"Band External Rotation":["Warm-up, Days A and D (2 x 12 per arm)","Primary: rotator cuff external rotators (infraspinatus, teres minor). Secondary: rear delts.","Anchor a light band at elbow height. Stand sideways to the anchor with a rolled towel between the working elbow and your side, elbow bent 90°, hand holding the band.","1) Rotate the forearm outward, away from the belly, keeping the elbow pinned. 2) Pause one second. 3) Return over three seconds.",["Elbow stays pinned on the towel.","Small, controlled range.","Wrist stays straight.","Shoulder stays down.","Use a light band; this is a warm-up, not a workout."],"Slow: 1 s out, 1 s pause, 3 s back.","Steady breathing; exhale as you rotate out.",["Using a band that is too heavy → Use the lightest band that still gives tension","Elbow drifting away from the body → Keep the towel in place","Shrugging → Press the shoulder down before each rep"],"Add reps to 15, then use the next band. Keep it light.","Warm-up on Days A and D, 2 sets of 12 per arm, included in the 3-5 minute warm-up. Stop if the shoulder pinches. Inspect and anchor the band securely."],"Band Lateral Walk":["Warm-up, Days B and C","Primary: glute medius and hip abductors.","Place a band around the thighs above the knees, feet hip-width, knees slightly bent.","1) Step sideways keeping tension. 2) Step the trailing foot in.",["Slight squat.","Knees out.","Toes forward.","Short steps.","Keep tension."],"10 slow steps each way.","Steady breathing.",["Knees collapsing → Push the knees out","Standing too tall → Hold a slight squat","Feet too wide → Short steps"],"Use a heavier band or add steps.","Warm-up on Days B and C. 10 steps each way."],"TRX Push-up (feet on chair)":["Travel Day A • Reps 8-15 • Rest 60 s • replaces Weighted Dips","Primary: chest, triceps. Secondary: front delts, core.","Place a sturdy chair behind you. Hold the TRX handles at about knee height, feet on the chair seat, body in a straight plank.","1) Brace and keep ribs down. 2) Lower the chest between the handles for three seconds. 3) Pause one second. 4) Press back to straight arms.",["Elbows about 45° from the body.","Hips level with shoulders and feet.","Hands in line with the chest at the bottom.","Squeeze the chest at lockout.","Keep the neck neutral."],"3-1-1-0: 3 s lowering, 1 s pause at the bottom, 1 s lifting, no hold at the top.","Inhale down, exhale as you press.",["Hips sagging → Squeeze the glutes and brace the abs","Elbows flaring wide → Keep them about 45°","Shoulders shrugging → Push the floor away at lockout"],"Raise the feet higher, slow the lowering, add a pause, or lower the handles. Make it easier by moving the feet to the floor.","Check the TRX anchor and straps. Make sure the chair cannot slide. Stop if the shoulder pinches."],"Heavy Band Pulldown":["Travel Day A • Reps 10-15 • Rest 60 s • replaces Weighted Pull-ups","Primary: lats. Secondary: biceps, lower traps.","Anchor a heavy band high (top of a door or a TRX anchor point). Kneel or stand facing it, arms extended overhead holding the band.","1) Pull the elbows down and back toward the ribs. 2) Squeeze for one second. 3) Return slowly over three seconds until the arms are straight.",["Elbows to the ribs, not the hands to the chest.","Chest tall, slight lean back at most.","Shoulders down away from the ears.","Control the return.","Keep tension in the band at the top."],"3-0-1-1: 3 s lowering, no pause at the bottom, 1 s lifting, 1 s hold at the top.","Exhale as you pull, inhale as you return.",["Pulling with the arms only → Start the pull by driving the elbows down","Leaning back too far → Stay mostly upright","Band slipping at the anchor → Re-anchor and test it before each set"],"Use a heavier band, step further back, or add a longer pause at the bottom.","Inspect the band for nicks before every use and anchor it where it cannot slip or snap back."],"Pike Push-up (feet on chair)":["Travel Day A • Reps 6-12 • Rest 45 s • replaces Incline DB Press","Primary: front delts, upper chest. Secondary: triceps, upper back.","Hands on the floor under your shoulders, feet on a chair, hips high so the body forms an upside-down V.","1) Bend the elbows to lower the top of your head toward the floor between the hands. 2) Pause one second. 3) Press back up to straight arms.",["Hips high, back flat.","Elbows about 45°, not flared.","Head travels between the hands.","Press straight up.","Keep the neck relaxed."],"3-1-1-0: 3 s lowering, 1 s pause at the bottom, 1 s lifting, no hold at the top.","Inhale down, exhale up.",["Hips dropping so it becomes a regular push-up → Walk the feet in and raise the hips","Elbows flaring → Keep them about 45°","Rushing the reps → Take three seconds down"],"Raise the feet higher, add a pause, or slow the lowering.","Stop if the shoulder pinches. Use a non-slip surface and a sturdy chair."],"Heavy Band Squat":["Travel Day B • Reps 10-15 • Rest 60 s • replaces DB Front Squat","Primary: quads. Secondary: glutes, core.","Stand on the middle of a heavy band, feet shoulder width. Hold the ends at your shoulders with the band running over them.","1) Brace and keep the chest up. 2) Sit down between the hips for three seconds. 3) Pause one second. 4) Drive up through the mid-foot.",["Chest up, elbows forward.","Knees track over the toes.","Heels stay flat.","Keep tension in the band at the bottom.","Stand tall at the top without leaning back."],"3-1-1-0: 3 s lowering, 1 s pause at the bottom, 1 s lifting, no hold at the top.","Inhale and brace on the way down, exhale as you stand.",["Band slipping off the feet → Stand on the middle with both feet and check it before each set","Torso falling forward → Keep the chest up","Knees collapsing in → Push the knees out"],"Use a heavier band, slow the lowering to four seconds, add a pause, or step wider on the band for more tension.","Inspect the band for nicks. Hold the ends securely so they cannot slip."],"Chair L-Sit":["Travel Day B • Reps 10-20 s • Rest 30 s • replaces L-Sit (p-bars)","Primary: abs and hip flexors. Secondary: triceps, front delts.","Sit on the front edge of a sturdy chair with hands beside the hips, gripping the seat edge, arms straight.","1) Press down through the hands and lift the hips and feet off the seat. 2) Tuck the knees, then extend the legs as you can. 3) Hold for the prescribed seconds. 4) Lower under control.",["Press the shoulders down away from the ears.","Chest tall.","Point the toes.","Keep legs together.","Breathe steadily."],"Isometric hold for the prescribed seconds.","Short, steady breaths while you hold.",["Shoulders shrugging up → Press harder through the hands","Legs dropping → Tuck the knees or use shorter holds","Chair sliding → Use a heavy chair against a wall"],"Tuck hold, then one leg straight, then both legs straight. Add 2-3 seconds each week.","Use a stable chair that cannot tip or slide. Stop if the wrists or shoulders hurt."],"Band Romanian Deadlift":["Travel Day B • Reps 10-15 • Rest 60 s • replaces DB Romanian Deadlift","Primary: hamstrings, glutes. Secondary: lower back, forearms.","Stand on the middle of a heavy band, feet hip width. Hold the ends in front of your thighs.","1) Push the hips back and slide the hands down the thighs for three seconds. 2) Stop at a firm hamstring stretch. 3) Pause one second. 4) Drive the hips forward and squeeze the glutes for one second.",["Hips back, not down.","Keep the band close to the legs.","Neutral spine, soft knees.","Feel the hamstring stretch.","Squeeze the glutes at the top."],"3-1-1-1: 3 s lowering, 1 s pause at the bottom, 1 s lifting, 1 s hold at the top.","Inhale and brace on the way down, exhale as you stand.",["Rounding the lower back → Reduce the range and brace harder","Squatting the movement → Push the hips back further","Band slipping → Check it is under both feet"],"Use a heavier band, slow the lowering, add a pause, or go to a single-leg version.","Stop if the lower back strains. Inspect the band before each use."],"Chair Bulgarian Split Squat":["Travel Day B • Reps 8-12/leg • Rest 45 s • replaces Bulgarian Split Squat","Primary: quads, glutes. Secondary: adductors, core.","Stand facing away from a sturdy chair, rear foot laces on the seat, front foot about two feet ahead.","1) Lower straight down for three seconds. 2) Front thigh near parallel. 3) Pause one second. 4) Drive up through the front heel.",["Weight on the front foot.","Front knee tracks over the toes.","Torso slightly forward to bias the glutes.","Move straight up and down.","Keep the hips square."],"3-1-1-0: 3 s lowering, 1 s pause at the bottom, 1 s lifting, no hold at the top.","Inhale down, exhale up.",["Stance too short → Step further out","Pushing off the rear foot → Keep weight on the front leg","Chair sliding → Place it against a wall"],"Add a heavy band held at the shoulders, a pause at the bottom, or slower lowering.","Use a stable chair. Stop short of any knee pain."],"Bodyweight Single-Leg Calf Raise":["Travel Day B • Reps 15-25/leg • Rest 30 s • replaces Single-Leg Calf Raise (DB)","Primary: gastrocnemius and soleus.","Stand on one foot on a step edge or stair, holding a wall or rail for balance.","1) Lower the heel for three seconds to a full stretch. 2) Pause two seconds. 3) Rise onto the toes. 4) Hold one second at the top.",["Full stretch at the bottom.","Rise straight up.","Keep the knee straight.","No bouncing.","Hold the top for one second."],"3-2-1-1: 3 s lowering, 2 s pause at the bottom, 1 s lifting, 1 s hold at the top.","Exhale up, inhale down.",["Bouncing → Pause in the stretch","Partial range → Use a full range","Rolling to the outside of the foot → Push through the big toe"],"Add reps to 25, slow the lowering, or add a backpack for load.","Use a stable support and a non-slip surface."],"Banded Hip Thrust":["Travel Day B • Reps 10-15 • Rest 45 s • replaces DB Hip Thrust","Primary: glutes. Secondary: hamstrings.","Upper back on the edge of a bed or chair. Anchor a heavy band under both feet and lay it across the hips.","1) Drive the hips up against the band. 2) Squeeze the glutes for two seconds at the top. 3) Lower under control.",["Chin tucked, ribs down.","Push through the heels.","Finish with a flat torso.","Do not overextend the lower back.","Keep tension in the band the whole set."],"2-0-1-2: 2 s lowering, no pause at the bottom, 1 s lifting, 2 s hold at the top.","Exhale as you thrust, inhale as you lower.",["Overarching the lower back → Tuck the ribs","Feet too far from the hips → Walk them closer","Band slipping → Re-anchor it under both feet"],"Use a heavier band, pause longer, or go single-leg.","Use a stable surface. Inspect the band for nicks."],"Band Reverse Lunge":["Travel Day C • Reps 8-12/leg • Rest 45 s • replaces DB Reverse Lunge","Primary: quads, glutes. Secondary: hamstrings, core.","Stand on the middle of a heavy band, holding the ends at your shoulders.","1) Step back about two feet. 2) Lower the back knee toward the floor for three seconds. 3) Push through the front foot to return.",["Upright chest.","Front knee over the foot.","Long step back.","Control the lowering.","Drive through the front heel."],"3-0-1-0: 3 s lowering, no pause at the bottom, 1 s lifting, no hold at the top.","Inhale down, exhale up.",["Short step → Take a longer step","Front knee collapsing → Push the knee out","Band slipping off the front foot → Check it before each set"],"Use a heavier band or add a pause at the bottom.","Use a clear floor. Inspect the band for nicks."],"TRX Underhand Row (feet elevated)":["Travel Day D • Reps 8-12 • Rest 60 s • replaces Weighted Chin-ups","Primary: lats, biceps. Secondary: mid-back.","Hold the TRX handles with an underhand grip, body in a plank, feet on a chair, arms straight.","1) Pull the elbows to the ribs. 2) Squeeze one second. 3) Lower for three seconds.",["Plank body, hips level.","Elbows to ribs.","Shoulders down.","Chest to the handles.","Control the lowering."],"3-0-1-1: 3 s lowering, no pause at the bottom, 1 s lifting, 1 s hold at the top.","Exhale as you pull, inhale as you lower.",["Hips sagging → Brace the glutes","Shrugging → Press shoulders down first","Half reps → Pull until the hands reach the ribs"],"Raise the feet, slow the lowering, or add a pause.","Check the TRX anchor and straps. Underhand grips load the elbows; stop at any elbow pain and use a neutral grip."],"Banded Push-up (heavy band)":["Travel Day D • Reps 8-15 • Rest 60 s • replaces DB Bench Press","Primary: chest. Secondary: triceps, front delts.","Wrap a heavy band across the upper back and hold the ends under your hands on the floor. Get into a plank.","1) Lower the chest to the floor for three seconds. 2) Pause one second. 3) Press up through the band to straight arms.",["Plank body, ribs down.","Elbows about 45°.","Keep the band across the shoulder blades.","Press the floor away.","Squeeze the chest at the top."],"3-1-1-0: 3 s lowering, 1 s pause at the bottom, 1 s lifting, no hold at the top.","Inhale down, exhale as you press.",["Hips sagging → Brace the glutes","Band sliding up the neck → Keep it low across the shoulder blades","Elbows flaring → Keep them about 45°"],"Use a heavier band, raise the feet on a chair, or add a pause.","Inspect the band. Keep the ends firmly under the hands so they cannot slip."],"One-Arm Band Row":["Travel Day D • Reps 10-15/arm • Rest 45 s • replaces One-Arm DB Row","Primary: lats, mid-back. Secondary: biceps, rear delts.","Anchor a band at chest height, hold the other end and step back until there is tension. Stagger the stance.","1) Pull the elbow toward the hip. 2) Squeeze one second. 3) Return slowly over two seconds.",["Shoulders square.","Elbow to the hip.","Do not twist.","Control the return.","Neutral neck."],"2-1-1-1: 2 s lowering, 1 s pause at the bottom, 1 s lifting, 1 s hold at the top.","Exhale as you pull, inhale as you return.",["Rotating the torso → Brace and slow down","Shrugging → Press the shoulder down first","Short range → Pull to the hip"],"Use a heavier band or step further back.","Anchor the band where it cannot slip. Inspect it before each use."],"Band Overhead Press":["Travel Day D • Reps 8-15 • Rest 45 s • replaces Standing DB Overhead Press","Primary: front delts. Secondary: lateral delts, triceps, core.","Stand on the middle of a heavy band, holding the ends at shoulder height.","1) Brace and press straight up. 2) Lock out with biceps near the ears. 3) Lower for three seconds.",["Ribs down, glutes tight.","Press straight up.","Neutral grip is fine.","Finish with biceps near the ears.","Control the return."],"3-0-1-0: 3 s lowering, no pause at the bottom, 1 s lifting, no hold at the top.","Exhale as you press, inhale as you lower.",["Arching the lower back → Brace and tuck the ribs","Pressing forward → Press straight up","Band slipping → Check it is under both feet"],"Use a heavier band, stand wider on the band, or add a pause.","Stop if the shoulder pinches. Inspect the band before each use."],"Underhand Band Pulldown":["Travel Day D • Reps 10-15 • Rest 45 s • replaces Heavy Band Lat Pulldown","Primary: lats. Secondary: biceps.","Anchor the band high and hold it with an underhand grip, arms extended. Kneel or stand.","1) Pull the elbows toward the ribs. 2) Squeeze one second. 3) Return slowly.",["Elbows to ribs.","Chest tall.","Shoulders down.","Control the return.","Keep tension in the band."],"3-0-1-1: 3 s lowering, no pause at the bottom, 1 s lifting, 1 s hold at the top.","Exhale as you pull, inhale as you return.",["Pulling with the arms only → Lead with the elbows","Leaning back too far → Stay upright","Band slipping → Re-anchor and test it"],"Use a heavier band or step back.","Underhand grips load the elbows; stop at any elbow pain. Inspect the band before use."],"TRX Biceps Curl":["Travel Day D • Reps 10-15 • Rest 30 s • replaces Incline DB Curl","Primary: biceps. Secondary: forearms, core.","Face the anchor, hold the handles with palms up, lean back with arms straight in a plank body.","1) Curl the hands toward the forehead keeping the elbows high. 2) Squeeze one second. 3) Lower for three seconds.",["Elbows stay high and still.","Plank body.","Squeeze at the top.","Full stretch at the bottom.","Control the lowering."],"3-1-1-0: 3 s lowering, 1 s pause at the bottom, 1 s lifting, no hold at the top.","Exhale as you curl, inhale as you lower.",["Hips sagging → Brace the glutes","Elbows dropping → Keep them level with the shoulders","Rushing → Take three seconds down"],"Walk the feet forward for a harder angle, or add a pause.","Check the TRX anchor and straps."]};
const MS=[["ov","Overview and principles",[["h","Training principles"],["li","Consistency. Key lifts stay the same for the whole program so load and reps can be tracked. Selected accessories rotate at Weeks 5 and 9."],["li","Effort. Heavy compounds stay 1-3 reps short of failure. Isolation work can approach failure in Build and Peak, and drop sets are used on only four exercises."],["li","Rest. Rest is exercise-specific. Short rests and supersets are kept where performance holds, and extended when reps or technique drop."],["li","Tempo. Slow, controlled lowering (2-4 s), a 1-2 s squeeze where it fits, and a strong mind-muscle connection."],["li","Recovery. Reset weeks (4 and 8) and a deload (12) are built in. Peloton intensity is reduced in those weeks and when recovery is poor."],["h","How the app works"],["li","Workout tab: sets, reps, tempo, rest, effort target and notes for each exercise. Tap an exercise name for a short card, then Full details for the complete page."],["li","Check off a set to start the rest timer. Every set has its own weight and reps."],["li","Weeks tab: all 13 weeks (0 to 12). Mark a week complete when you finish it."],["li","Log tab: body weight, weekly check-ins and the animal report."],["li","Optional work is labelled OPTIONAL. Skip it first when short on time."]]],["rs","Rest and superset guide",[["t",[["Exercise type","Timer after each set","Own-muscle recovery in a pair*","Examples"],["Heavy compounds","60 s (45-75)","About 2.5 min","Weighted dips, pull-ups, chin-ups, front squat, RDL, DB bench"],["Moderate compounds and TRX rows/presses","45 s (30-60)","About 2 min","Incline press, OH press, one-arm row, lunge, split squat, hip thrust, TRX chest press"],["Isolation","30 s (20-45)","About 1.5-2 min","Lateral raise, curls, triceps work, face pull, calf raise"],["TRX accessories, core, holds","30 s (20-45)","About 1.5-2 min","TRX fly, Y-raise, fallout, hamstring curl, L-sit, rollout"]]],["p","*When you alternate A and B in a pair, the muscle in A recovers for your timer + the B set + your timer again, which is about twice the timer plus 40 seconds."],["li","Timer. Check off a set to start the timer. The timer adjusts in 15-second steps up or down."],["li","Rule. Short rests stay when reps and technique remain consistent. Extend rest when reps fall or form slips. Do not lengthen every rest if short rests are working."],["li","Heavy pairs. Weighted dips and pull-ups train opposing muscles, but both are heavy and tax the shoulders, elbows and grip. Use the full 75 s after them if reps drop or the shoulder feels loaded."],["li","Conditioning. Conditioning comes from the supersets and the Peloton ride. Heart rate is not a target and nothing is rushed to keep it high."]]],["pr","Progression and decision rules",[["li","Add load. Double progression: increase load when all prescribed sets reach the top of the rep range with good technique and the target RIR. Use the smallest jump (2.5-5 lb dumbbell or belt jump)."],["li","Missed reps. If you miss the bottom of the range on one set, repeat the load next session. If you miss on two sets, drop the load 5-10% and rebuild."],["li","Limited weights. When dumbbells or belt jumps are too big: slow the lowering to 4 seconds, add a 2-3 second pause, add a rep above the range, move to single-limb variations, add band tension, or increase TRX angle."],["li","Band progression. Bands cannot be compared with dumbbell weight. Track the band color, anchor height and your step distance. Progress to a heavier band or step back to add tension."],["li","Rest. Extend rest by 15 seconds (timer up one step) if reps drop more than 2 below your target, technique breaks down, or the next set will miss the range. Return to the default next session."],["li","Poor recovery. If resting heart rate is up 5+ bpm for several days, sleep is poor, or lifts feel grindy for two sessions, drop one set per exercise and skip optional work for the week."],["li","Time. Skip optional work first (see Time management). Never skip warm-up sets or priority lifts to save time."],["li","Nutrition. Review your MyNetDiary weekly averages (calories and protein) alongside weight, waist and lifts. A flat scale alone is not a reason to change the program during a recomp; waist and strength trends matter more."],["h","Progression rules"],["p","The decision rules in Progression and decision rules apply to every exercise. For belt lifts: add 2.5-5 lb when all sets reach the top of the range. For band exercises: move to a heavier band or step further from the anchor, then add reps. For TRX: walk the feet forward, elevate the feet, slow the tempo or move to a single limb."],["h","Week 0 calibration session"],["p","Do this once in the week before Week 1, in one or two short sessions. It sets starting loads so Weeks 1-2 are not guesswork."],["li","Which lifts. Cover the priority lifts: weighted dips, weighted pull-ups, incline DB press, DB front squat, DB Romanian deadlift, Bulgarian split squat, TRX chest press, weighted chin-ups, DB bench press, one-arm DB row and DB overhead press."],["li","How. Warm up with two lighter sets, then do one working set at the load you think is right. Choose the weight where you finish the target reps with 2-3 reps in reserve."],["li","Record. Write the load in the Week 0 column of the key lift tracker. If a set felt easier than 3 reps in reserve, add the smallest jump in Week 1."],["li","Limit. Do not test to failure. The goal is a repeatable starting load, not a maximum."],["h","Week 11 retest"],["p","Week 11 is the retest week, not Week 12. Log your best set on each priority lift and compare with your Week 1-3 numbers. Week 12 is the deload and no testing is done."]]],["vr","Exercise variation schedule",[["t",[["Weeks","Day / slot","Original","Replacement","Reason"],["5-8","A 4B","TRX Triceps Extension","Band Overhead Triceps Extension","Long-head stretch and rising band tension, outside dumbbell limits"],["5-8","D 4B","DB Lateral Raise","Band Lateral Raise","Tension at the top where the dumbbell is weakest"],["9-12","A 4A","Hammer Curl","Band Biceps Curl","Different resistance profile for Peak"],["9-12","B 3B","TRX Hamstring Curl","TRX Single-Leg Hamstring Curl","Progression when the two-leg version is easy"],["Weeks 1-12","All priority lifts","—","Unchanged","Keep load and rep tracking consistent"]]],["p","Swaps happen at the start of Build (Week 5) and Peak (Week 9), never in reset weeks, so the reset-week exercise matches the block it follows."]]],["rd","Reset and deload",[["t",[["Week","Phase rule","Sets","RIR","Drop sets","Peloton"],["4","Reset after Foundation","Foundation sets minus 1 on every exercise (minimum 1)","3-4 heavy, 3 other","None","8 x 30 s / 60 s, RPE 7"],["8","Reset after Build","Build sets minus 1 on every exercise (minimum 1)","3-4 heavy, 3 other","None","8 x 30 s / 60 s, RPE 7"],["12","Deload after Peak","Foundation sets minus 1 on every exercise (minimum 1)","4","None","20 min easy or skip"]]],["p","The Week 4, 8 and 12 tables in the Weeks tab show the actual set counts. Loads stay the same in resets. In the Week 12 deload, use about 80% of your Week 11 loads and stop 4 reps short."]]],["co","Core training",[["p","Your core work is kept. Days A, C and D start with a 5-minute nonstop ab block (60 seconds each, five exercises). Day B builds core in through L-sits and rollouts, and Day C adds TRX fallouts."],["li","Circuit 1 (Weeks 1, 4, 7, 10): Hanging Knee Raise, Dead Bug, TRX Fallout, Plank, Reverse Crunch"],["li","Circuit 2 (Weeks 2, 5, 8, 11): Ab Wheel Rollout, Bicycle Crunch, L-Sit (p-bars), Side Plank, Mountain Climbers"],["li","Circuit 3 (Weeks 3, 6, 9, 12): TRX Knee Tuck, Hollow Hold, Hanging Leg Raise, Reverse Crunch, Side Plank"],["t",[["Core function","Where it is trained"],["Anti-extension","Ab wheel rollout, TRX fallout, plank, dead bug"],["Trunk flexion","Reverse crunch, bicycle crunch, hollow hold"],["Anti-rotation","TRX single-arm row, one-arm DB row, plank"],["Lateral stability","Side plank, split squat, single-leg RDL"],["Hip flexion","L-sit, hanging knee and leg raises, TRX knee tuck"]]],["p","The ab block is optional. Skip it or shorten to 3 minutes when time or recovery requires."],["li","The ab block and the cool-down stretch both have a guided timer in the app: tap Start ab block, or Finish workout then Start stretch."]]],["tm","Time management and alternatives",[["p","If a session runs long, drop work in this order and keep the priority lifts:"],["li","1. Day C finisher, optional band face pull (Day D), optional arm pairs (4A/4B on Days A and D)."],["li","2. Shorten the ab block to 3 minutes."],["li","3. Cut one set from non-priority accessories."],["p","Light week (use when recovery slips in Build or Peak): cut in this order, and keep it for one week only:"],["li","1. Thursday TRX chest fly."],["li","2. Optional arm pairs and the optional band face pull."],["li","3. One set from each isolation exercise."],["t",[["Day","Priority lifts (never skip)"],["A","Weighted dips, weighted pull-ups, incline DB press"],["B","DB front squat, DB Romanian deadlift, Bulgarian split squat"],["C","TRX chest press, TRX single-arm row, DB reverse lunge"],["D","Weighted chin-ups, DB bench press, one-arm DB row, DB overhead press"]]],["p","Alternatives: if the shoulder flares on dips, use TRX Chest Press. If a belt is unavailable, use bodyweight pull-ups and add a 3-second pause. If bands are unavailable, use light dumbbells with slow tempos."]]],["tv","Travel workouts",[["p","Each lifting day has a travel version that uses TRX, bands, bodyweight and a sturdy chair or bed. It trains the same muscles as the standard day and follows the same sets, reps, tempo, rest and effort for your current week."],["h","How to use it"],["li","Home screen: tap Traveling? Use the travel version, or use the Standard / Travel switch at the top of any workout day."],["li","Log reps only. For band exercises, tap Light, Medium or Heavy for the band you used."],["li","A travel day counts as that day in the Weeks tab. Travel sessions add no pounds or animals to the totals."],["li","Wednesday: a 20-minute bodyweight HIIT with a guided timer replaces the bike ride. In Week 12 it is an easy walk."],["h","How to progress without weights"],["li","Change the angle or foot position, slow the tempo, add a pause, raise the feet, use a heavier band, or move to a harder single-limb version."],["h","Safety"],["li","Inspect bands for nicks before every use, and anchor them where they cannot slip or snap back."],["li","Check the TRX anchor and straps, and make sure chairs and benches cannot slide or tip."]]]];

if(M.x){const e=EX[M.x],L=['Target muscles','Setup','Execution','Technique cues','Tempo','Breathing','Common mistakes','Progression','Safety'];if(!e)return bk;
return bk+`<div class="card" style="margin-top:10px"><h3 style="margin:0 0 4px;color:var(--ac)">${E(M.x)}</h3><div class="meta">${E(e[0])}</div>${[1,2,3,4,5,6,7,8,9].map(i=>`<h4>${L[i-1]}</h4>`+(Array.isArray(e[i])?e[i].map((c,j)=>`<div class="mu" style="padding:2px 0">${i==4?(j+1)+'. ':'• '}${E(c)}</div>`).join(''):`<div class="mu">${E(e[i])}</div>`)).join('')}</div>`}
if(M.s){const s=MS.find(x=>x[0]==M.s);return bk+`<div class="card" style="margin-top:10px"><h3 style="margin:0 0 6px;color:var(--ac)">${s[1]}</h3>${mb(s[2])}</div>`}
return`<div class="card"><h3 style="margin:0 0 4px;color:var(--ac)">📖 Full manual</h3><div class="mu">The complete program guide. Tap a section, or find any exercise in the library below.</div></div>${MS.map(s=>`<div class="card" onclick="M.s='${s[0]}';render();scrollTo(0,0)"><div class="nm">${s[1]} ›</div></div>`).join('')}<div class="card"><div class="nm">Exercise library</div><input style="width:100%;margin-top:8px" placeholder="Search exercises" value="${libq}" oninput="libq=this.value;libr()"><div id="lib"></div></div>`}

function manBack(){if(M.x){if(M.f){v=M.f;M.f=null;M.x=null;render();scrollTo(0,M.y||0);return}M.x=null}else if(M.s)M.s=null;else{go('guide');return}render();scrollTo(0,0)}
