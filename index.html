const SA="Schedule Adjustment (proposed days with an approval step) is planned for a later update. For now, open any day's session from the Workout tab whenever it fits.";
const GR=[['Training and Progress',['c10','c12','c13','c14','c15','c17']],['Recovery and Wellness',['c5','c6','c7','c8','c9','c20']],['Schedule and Logistics',['c1','c2','c3','c4','c18','c16','c19']],['Feedback and Tools',['c11']]];
const CC={
c1:["Missed a Workout",["Saturday is the best make-up day. Do the missed workout as written. If you are short on time, use the travel version or skip optional work.","If Saturday does not work, Sunday is acceptable. If you made up Friday's Day D on Sunday, do Day B (lower body) on Monday and Day A on Tuesday so your upper body gets about 48 hours between sessions. Keep Wednesday's ride and Thursday's Day C as normal.","If neither day works, skip it. One missed session out of four is a small gap.","These examples use the standard Monday to Friday layout. For a missed Monday to Thursday session, the same ideas apply: one lifting session per day, with upper and lower days spread out."],["Never do two lifting sessions in one day.","Do not squeeze sessions into consecutive days to catch up.","Do not add missed sets to another workout or add weight to make up for it.","Do not repeat the whole week because of one missed session."],["One missed session does not change your weights or your phase.","Your weight suggestions still come from your last logged session.",SA]],
c2:["Missed Multiple Workouts",["If you miss two or more sessions in a week, repeat that week once before moving on, with the same weights.","A busy week is a short disruption. Illness, travel or weeks away are longer ones, so use Returning After a Break.","To repeat a week, leave the week picker where it is. A repeated week uses the same records, so new entries replace the old ones. Export a backup first from the Quick reference section if you want to keep both."],["Do not squeeze every missed workout into a few days.","Do not do two workouts in one day.","Do not move on as if every session was done.","Do not restart the whole program after a short interruption."],["Repeating a week does not change your exercises or the program.","Weight suggestions continue from your last logged session.","A repeat counter that keeps both passes separate is planned for a later update."]],
c3:["Returning After a Break",["About one week away: return at about 90% of your last weights, with one fewer set per exercise for the first week. Focus on technique.","Two weeks or more: go back a phase, or start at Foundation effort, and rebuild over 1 to 2 weeks.","Planned reset and deload weeks are not a break.","The app's weight suggestions come from your last session, so lower the weights by hand."],["Do not jump back to your heaviest weights.","Do not try to make up the lost volume.","Do not assume you lost all your progress.","Do not skip the warm-up."],["This is a temporary adjustment. Use the week picker to choose where to restart.","Your history is kept, and suggestions resume from your new sessions."]],
c4:["How Do I Rearrange My Workouts This Week?",["Open any day's session from the Workout tab when it fits. Keep the order A, B, ride, C, D when you can.","Keep a day between lifting sessions that train the same muscles, and keep the ride on any free day.","If a session cannot fit safely, skip it.",SA],["Do not do two lifting sessions in one day.","Do not stack demanding sessions on consecutive days.","Do not shorten rest or change exercises or weights because a workout moved.","Do not carry unfinished workouts into the next week."],["Moving a workout does not change it. The app does not tie workouts to dates yet, so nothing needs updating.","Return to the normal order when practical."]],
c5:["Pain or Joint Trouble",["Stop the movement and see how it feels.","Use a gentler option from the program, such as the TRX Chest Press in place of dips, a lighter load or a smaller range. The travel version also has lighter options.","Stop and get checked for sharp pain, numbness, swelling, instability, or pain that lingers or gets worse.","Chest pain, fainting or severe shortness of breath: stop and seek urgent care."],["Do not push through sharp or worsening pain.","Do not guess the cause.","Do not invent a swap that changes the exercise.","Do not treat joint pain like normal soreness."],["A temporary change does not alter your program. Log what you actually did.","Weights from a substitute exercise are not carried to the original.","This is general fitness guidance, not a diagnosis."]],
c6:["I'm Really Sore From My Last Workout",["Mild soreness (you move normally): train as planned after a good warm-up.","Moderate soreness: warm up and see if it eases. If it does, train. If not, go lighter.","Significant soreness (you cannot move normally): postpone that workout.","Sharp or one-spot pain, dark or cola-colored urine, marked weakness or swelling: stop and seek medical care."],["Do not force reps when soreness limits your movement.","Do not treat sharp pain as soreness.","Do not add extra workouts later to make up for a postponed one.","Do not assume more soreness means a better workout."],["Ordinary soreness does not change your weights or progression.","If you postpone a session, see Missed a Workout.",SA,"This is general guidance, not a diagnosis."]],
c7:["Feeling Run Down or Sleeping Poorly",["Tired but otherwise fine: do one fewer set per exercise and skip drop sets and optional work.","Or use the light-week trim for one week: cut Thursday's TRX chest fly, then the optional pairs, then one set from each isolation lift.","Very exhausted or unwell: skip the workout. The light week is written advice, not a switch in the app."],["Do not push for maximum effort when you are very tired.","Do not add the lost volume back later.","Do not change your plan because of one poor night's sleep."],["A temporary cut does not change your progression.","Resume the normal program when you have recovered."]],
c8:["Sick or Feeling Ill",["Do not train with a fever, chills, marked weakness, chest symptoms, trouble breathing or a stomach illness.","With mild head-cold symptoms, train only if you feel fine, and keep it easy.","After you recover, return gently. See Returning After a Break.","Get medical advice if symptoms are concerning or getting worse."],["Do not train with a fever.","Do not try to sweat out an illness.","Do not double up sessions after you recover.","Do not return to hard effort while symptoms remain."],["A short illness does not restart the program.","A longer one may mean repeating a week or using Returning After a Break.","Your history is kept."]],
c9:["Scheduled Deload / Light Week",["Follow the written plan. In reset weeks (4 and 8) every exercise has one fewer set at the same weights, with 3 to 4 reps left in the tank.","In the deload (Week 12) use about 80% of your Week 11 weights, one fewer set than Foundation, and 4 reps left in the tank.","The app shows the reduced sets automatically, with no drop sets and no weight suggestions in these weeks."],["Do not add sets because it feels easy.","Do not add missed workouts to these weeks.","Do not use heavier weights.","Do not skip them because you feel strong."],["These weeks are part of the plan and are not lost progress.","Afterwards you continue with the next phase as scheduled."]],
c10:["Weights Stalled",["Check sleep, food, rest times and technique.","Keep working inside the rep range. Stay at the same weight and add reps until every set reaches the top, then add weight.","You can also progress with a slower lowering, a pause, or a harder variation.","Keep to the scheduled resets and deload."],["Do not add weight just because progress feels slow.","Do not lower the weight after one bad session.","Do not add extra sets.","Do not swap exercises because of one hard day."],["Continue the program. The tip under each finished exercise tells you what to do next.","During a recomp, a flat scale is not a stall. Watch your waist and your strength trend."]],
c11:["Workout Feels Too Easy or Too Hard",["After the last set of a weighted exercise, tap Easy, Right or Too hard for how that last set honestly felt.","Easy: next time's suggested weight goes up one step. Right: no change. Too hard: it goes down one step."],["Do not tap Easy just to get a heavier weight.","Do not treat one tap as a reason to change the program.","Do not sacrifice form to meet the reps."],["The taps only change the suggested weight, and you can overwrite it.","They never change sets, reps, tempo, rest or your phase.","In Week 0 they help set your Week 1 starting weights."]],
c12:["When Should I Increase My Weights?",["Add weight when every set reaches the top of the rep range at the same weight, with good form and the right effort. The app then suggests the next weight.","Suggestions are about 2.5 to 5%, rounded to 2.5 lb steps up to 50 lb per dumbbell, 5 lb steps above that, and 2.5 lb on the belt.","Lighter isolation lifts (lateral raises, curls, triceps) need to reach the top in two sessions in a row.","If you beat the top by 2 or more reps on every set, the jump is larger."],["Do not add weight when only the first set reached the top.","Do not add weight if later sets fall short.","Do not add weight when your form breaks down.","Do not use random jumps."],["The app works the suggestion out from your logged sets, and this card does not change anything.","The suggested weight fills the boxes and you can edit it."]],
c13:["Couldn't Complete All Prescribed Repetitions",["Log the reps you actually did. Stop a set when your form breaks down.","First time a set falls below the range: repeat that weight next time.","Below the range in two sessions in a row: the app suggests lowering the weight 5 to 10%.","First set 3 or more reps below the bottom of the range: it suggests lowering 10% right away.","Lowered the weight mid-session in two sessions in a row: it suggests lowering your starting weight about 5%."],["Do not log reps you did not do.","Do not lower the weight after one slightly missed set.","Do not change the next load based on one set."],["Suggestions come from your logs and the first set matters most.","This card explains the rules and does not change anything."]],
c14:["How Long Should I Rest Between Sets?",["Follow the timer: 60 s after heavy lifts, 45 s after moderate ones, 30 s for isolation, TRX and core.","Use the 15 s buttons to take more rest when you need it for form. The app remembers your change for that exercise."],["Do not rush heavy lifts to finish sooner.","Do not cut rest so short that form suffers.","Do not stretch rest a lot without a reason.","Do not assume shorter rest is always better."],["Rest times are part of the program.","Changing the timer only changes your timer for that exercise. It does not change your weights."]],
c15:["Not Sure I'm Performing an Exercise Correctly",["Tap the exercise name for the short card (3 cues, the top mistake and how to progress), then Full details for setup, execution, breathing and safety.","Lower under control for 2 to 4 seconds, and squeeze 1 to 2 seconds at the top where it is written.","Use a lighter weight if your form slips, and get coaching if you are unsure."],["Do not trade form for reps or weight.","Do not rush the reps.","Do not swap in an unrelated exercise.","Do not ignore pain."],["Good form is part of progression, so do not add weight when it is inconsistent.","The app does not change your prescription."]],
c16:["Equipment Unavailable",["Use the travel version (TRX, bands, bodyweight, a chair) when dumbbells or a bar are missing. The Standard / Travel switch is on each workout day and on Home.","For band exercises, tap Light, Medium or Heavy for the band you used.","If even that is not possible, skip the exercise instead of inventing a swap."],["Do not assume two exercises are the same.","Do not carry weights between different exercises.","Do not make up a swap that changes the exercise."],["Travel sessions are logged separately and count as that day in the Weeks tab.","They add no pounds or animals, and the original exercise history is untouched."]],
c17:["Do I Need to Warm Up?",["Spend 3 to 5 minutes on easy movement. The day's warm-up line tells you which: band external rotations on upper days, band lateral walks on lower and TRX days.","Do one lighter ramp-up set before your first heavy lift.","The ab block is optional and comes after the warm-up."],["Do not turn the warm-up into a workout.","Do not do long static stretches before heavy sets.","Do not skip preparation before heavy lifts."],["Warm-ups do not change your sets. Stay with the written warm-up."]],
c18:["Traveling or Away From Normal Equipment",["Use the travel version. It needs only TRX, bands, bodyweight and a sturdy chair or bed.","On Wednesday, the bodyweight HIIT replaces the bike ride.","Keep sessions to about 45 minutes. If you have no space or gear, skip."],["Do not recreate your normal workout with the wrong gear.","Do not add extra sessions to make up for travel.","Do not compare travel exercises with normal ones for weights."],["Travel logs stay separate and count as that day.","They add no pounds or animals. Your normal suggestions resume afterwards.",SA]],
c19:["Short on Time",["Do the priority lifts first, which are listed at the top of each day.","Skip in this order: work marked OPTIONAL, the Thursday finisher, a shorter ab block, then one set from non-priority exercises.","Keep the full rest on heavy lifts."],["Do not rush the reps.","Do not cut rest so short that form suffers.","Do not double up later.","Do not log skipped exercises as done."],["Log only what you did.","Skipped optional work does not affect progression."]],
c20:["Nutrition and Workout Performance",["Eat protein through the day, with enough carbs around training, and drink water.","Aim for consistent, ordinary eating and not extremes. A recomp takes patience.","Check your weekly averages alongside your weight, waist and lifts."],["Do not crash diet.","Do not think supplements are needed.","This is general education, not medical nutrition advice.","Forge does not set calorie or macro targets."],["Nutrition supports training and does not change your prescription.","The app does not log food. Use your food app, and bring the weekly averages to Claude with Copy Coach Summary."]]};
const li=a=>a.map(t=>`<div class="mu" style="padding:3px 0 3px 14px;text-indent:-14px">• ${E(t)}</div>`).join('');
function coach(){if(CD.cs)return csPage();if(CD.id){const c=CC[CD.id];return`<button class="btn" onclick="CD={};render();scrollTo(0,0)">‹ Back</button><div class="card" style="margin-top:10px"><h3 style="margin:0 0 6px;color:var(--ac)">${c[0]}</h3><details open><summary>What should I do?</summary>${li(c[1])}</details><details><summary>What should I avoid?</summary>${li(c[2])}</details><details><summary>How does this affect my program moving forward?</summary>${li(c[3])}</details></div>`}
return`<div class="card" onclick="M={};go('man')"><div class="nm">📖 Full manual ›</div><div class="mu">The complete program guide and every exercise in detail.</div></div><div class="card cs" onclick="CD={cs:1};render();scrollTo(0,0)"><div class="nm">📋 Copy Coach Summary ›</div><div class="mu">Copy your recent logs to paste into Claude or send to a coach.</div></div>`+GR.map(g=>`<div class="gh">${g[0]}</div>`+g[1].map(id=>`<div class="card" onclick="CD={id:'${id}'};render();scrollTo(0,0)"><div class="nm">${CC[id][0]} ›</div></div>`).join('')).join('')+`<details class="card" style="margin-top:14px"><summary class="nm">Quick reference</summary>${qref()}</details>`}
function summary(n,inc){const L=['Forge 12-week program · Week '+S.wk+' ('+ph(S.wk).nm+')','Program: 4 lifting days (A upper, B lower, C TRX full body, D upper heavy) plus a Wednesday ride. Double progression. Rest 60/45/30 s. Dates are not recorded, so weeks are in program order.'],fx={e:'easy',r:'right',h:'too hard'},bx={l:'light',m:'medium',h:'heavy'};
for(let w=Math.max(0,S.wk-n+1);w<=S.wk;w++){const out=[];['A','B','C','D'].forEach(d=>{const ln=[];Object.keys(S.logs).filter(k=>k.startsWith(w+'|'+d+'|')).forEach(k=>{const st=S.logs[k].filter(x=>x.k||x.w||x.r);if(!st.length)return;ln.push('- '+k.split('|')[2]+': '+st.map(x=>(x.w||'no weight')+' x '+(x.r||'?')+(x.d?' (drop set)':'')+(x.k?'':' (not checked)')).join(', ')+(S.fl[k]?' · felt '+fx[S.fl[k]]:'')+(S.bl[k]?' · band '+bx[S.bl[k]]:''))});if(ln.length)out.push(DAYS[d].n+' Day '+d+(S.tm[w+'|'+d]?' (travel version)':'')+':\n'+ln.join('\n'))});L.push('\nWeek '+w+' ('+ph(w).nm+')'+(S.wd[w]?' - marked complete':'')+'\n'+(out.length?out.join('\n'):'No sets logged.'))}
if(inc){if(S.bw.length)L.push('\nBody weight: '+S.bw.slice(-5).map(x=>x.d+' '+x.v+' lb').join(', '));const ck=Object.keys(S.ci).filter(k=>+k>S.wk-n&&+k<=S.wk).sort((a,b)=>a-b).map(k=>'Week '+k+': waist '+(S.ci[k].wa||'-')+', resting HR '+(S.ci[k].hr||'-')+', shoulder '+(S.ci[k].sh||'-')+'/10'+(S.ci[k].nt?', notes: '+S.ci[k].nt:''));if(ck.length)L.push('Check-ins:\n'+ck.join('\n'))}
L.push('\nNot recorded by the app: workout dates, progression changes, substitutions.\nMy question: ');return L.join('\n')}
function csPage(){const b=(k,v,l)=>`<button class="btn ${(k=='n'?CSn:CSi)==v?'on':''}" onclick="${k=='n'?'CSn':'CSi'}=${v};render()">${l}</button>`;
return`<button class="btn" onclick="CD={};render();scrollTo(0,0)">‹ Back</button><div class="card cs" style="margin-top:10px"><h3 style="margin:0 0 6px;color:var(--ac)">📋 Copy Coach Summary</h3><div class="mu">Copies your recent logs as text to paste into Claude or send to a coach. Nothing in the app is changed.</div><label>How far back</label><div class="row3">${b('n',1,'This week')}${b('n',2,'2 weeks')}${b('n',4,'4 weeks')}</div><label>Include body weight and check-ins</label><div class="row2">${b('i',1,'Yes')}${b('i',0,'No')}</div><button class="btn on" style="margin-top:12px;width:100%" onclick="copyCS()">Copy summary</button><div id="csm" class="hint"></div><a class="btn" style="display:block;text-align:center;margin-top:8px;text-decoration:none" href="https://claude.ai/new" target="_blank" rel="noopener">Open Claude</a><textarea id="cst" readonly style="width:100%;margin-top:10px" rows="12">${E(summary(CSn,CSi))}</textarea></div>`}
function copyCS(){const t=$('#cst'),m=$('#csm'),ok=()=>{m.textContent='Copied ✓'};t.select();if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t.value).then(ok).catch(()=>{document.execCommand('copy');ok()});else{document.execCommand('copy');ok()}}

function render(){$('#nav').innerHTML=NV.map(x=>`<button class="${v==x[0]||(v=='man'&&x[0]=='guide')?'on':''}" onclick="go('${x[0]}')"><span>${IC(x[0],v==x[0]||(v=='man'&&x[0]=='guide'))}</span>${x[2]}</button>`).join('');const t=$('#tabs');t.style.display=v=='wo'?'flex':'none';if(v!='wo')t.innerHTML='';$('#wk').style.display=(v=='wo'||v=='home')?'':'none';$('#app').innerHTML=({home,wk:weeks,log:logv,guide:coach,wo:workout,man:manual})[v]();if(v=='man'&&!M.x&&!M.s)libr()}
function home(){const w=S.wk,p=ph(w),td={1:'A',2:'B',3:'W',4:'C',5:'D'}[dow];
return`<div class="card"><h2 style="margin:0 0 4px;color:var(--ac)">Forge</h2><div class="mu">A 12-week recomposition program: build muscle and strength while staying lean. Four lifting days plus one 20-minute HIIT ride each week, about 45 minutes per session.</div></div>
<div class="card"><div class="meta">This week</div><div class="nm">Week ${w} · ${p.nm}</div><div class="mu">${BL[p.nm]}</div><button class="btn" style="margin-top:8px" onclick="tab='${td||'A'}';go('wo')">${td?'Open today’s session':'Open Monday’s session'}</button><br><button class="btn" style="margin-top:8px" onclick="S.tm[S.wk+'|${td||'A'}']=1;sv();tab='${td||'A'}';go('wo')">✈️ Traveling? Use the travel version</button></div>
<div class="card" onclick="M={};go('man')"><div class="nm">📖 Full manual ›</div><div class="mu">The complete program guide and every exercise in detail.</div></div>
<div class="card"><div class="nm">Weekly schedule</div>${[['Mon','A','Upper push / pull'],['Tue','B','Lower + core'],['Wed','W','Peloton HIIT'],['Thu','C','TRX full body'],['Fri','D','Upper heavy']].map(x=>`<div class="mu" style="padding:4px 0" onclick="tab='${x[1]}';go('wo')"><b>${x[0]}</b> · ${x[2]}</div>`).join('')}<div class="mu">Sat / Sun: rest</div></div>
<div class="card"><div class="nm">How it works</div><ul class="ul"><li>Check off a set to start the rest timer. Adjust it ±15 s and the change is remembered.</li><li>Every set has its own weight and reps. Lower a set if you need to.</li><li>Tap an exercise name for cues, the top mistake and progression.</li><li>Start with Week 0 to find your loads, then follow Weeks 1-12.</li><li>Log body weight and weekly check-ins in the Log tab.</li><li>Swipe left or right to move between sections.</li><li>Finish a workout to see how many animals you lifted.</li></ul></div>`}
function dn(w){return['A','B','C','D'].filter(d=>Object.keys(S.logs).some(k=>k.startsWith(w+'|'+d+'|')&&S.logs[k].some(s=>s.k))).length}
function weeks(){return'<div class="note">Tap a week to open it.</div>'+Array.from({length:13},(_,w)=>{const p=ph(w);return`<div class="card ${w==S.wk?'cur':''}" onclick="S.wk=${w};sv();$('#wk').value=${w};go('wo')"><div class="h"><span class="cd">${w}</span><span class="nm">${S.wd[w]?'✓ ':''}${p.nm}</span><span class="meta">${dn(w)}/4 sessions</span></div><div class="mu">${BL[p.nm]}${DSW.includes(w)?' Drop sets on.':''}${w==11?' Retest week.':''}</div>${pbtn(w)}${wbtn(w)}</div>`}).join('')}
function sess(){const m={};Object.keys(S.logs).forEach(k=>{const a=k.split('|'),n=S.logs[k].filter(x=>x.k).length;if(n)m[a[0]+'|'+a[1]]=(m[a[0]+'|'+a[1]]||0)+n});return Object.keys(m).sort((a,b)=>{const x=a.split('|'),y=b.split('|');return y[0]-x[0]||y[1].localeCompare(x[1])}).slice(0,8).map(q=>{const a=q.split('|');return`<div class="mu">Wk ${a[0]} · ${DAYS[a[1]].n} ${DAYS[a[1]].t}: ${m[q]} sets checked</div>`}).join('')||'<div class="mu">No sessions yet.</div>'}
function logv(w){const B=S.bw,td=new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10),c=S.ci[w]||{},f=(k,l)=>`<div><label>${l}</label><input inputmode="decimal" value="${c[k]||''}" onchange="ci(${w},'${k}',this.value)"></div>`;
const tr=B.length>1?`<div class="hint">Latest ${B[B.length-1].v} lb · ${(B[B.length-1].v-B[0].v>=0?'+':'')+(B[B.length-1].v-B[0].v).toFixed(1)} lb since ${B[0].d}</div>`:'';
const ch=Object.keys(S.ci).sort((a,b)=>a-b).map(k=>`<div class="mu">Wk ${k}: waist ${S.ci[k].wa||'–'} · RHR ${S.ci[k].hr||'–'} · shoulder ${S.ci[k].sh||'–'}/10${S.ci[k].nt?' · '+S.ci[k].nt:''}</div>`).join('');
return`<div class="card"><div class="nm">Body weight</div><div class="row2"><div><label>Weight (lb)</label><input id="bwv" inputmode="decimal"></div><div><label>Date</label><input id="bwd" type="date" value="${td}"></div></div><button class="btn" style="margin-top:8px" onclick="addbw()">Save weight</button>${tr}${B.slice(-8).reverse().map(x=>`<div class="mu">${x.d} · ${x.v} lb <span onclick="delbw('${x.d}')" style="float:right;color:var(--dr)">✕</span></div>`).join('')}</div>
<div class="card"><div class="nm">Week ${w} check-in</div><div class="row2">${f('wa','Waist (in)')}${f('hr','Resting HR')}${f('sh','Shoulder 0-10')}</div><label>Notes (sleep, soreness, energy)</label><textarea style="width:100%" rows="2" onchange="ci(${w},'nt',this.value)">${c.nt||''}</textarea>${ch}</div>
${pandaCard()}<div class="card"><div class="nm">Recent sessions</div>${sess()}</div>`}
function addbw(){const x=parseFloat($('#bwv').value),d=$('#bwd').value;if(!x||!d)return;S.bw=S.bw.filter(y=>y.d!=d);S.bw.push({d,v:x});S.bw.sort((a,b)=>a.d.localeCompare(b.d));sv();render()}
function delbw(d){S.bw=S.bw.filter(y=>y.d!=d);sv();render()}
function qref(){return`<div class="card"><div class="nm">Rest</div><div class="mu">60 s after heavy lifts, 45 s moderate, 30 s isolation, TRX and core. Adjust the timer ±15 s when needed.</div></div>
<div class="card"><div class="nm">Tempo and RIR</div><div class="mu">Tempo is four numbers: seconds lowering, pause at the bottom, seconds lifting, hold at the top. RIR is reps left in the tank.</div></div>
<div class="card"><div class="nm">Drop sets (*)</div><div class="mu">Only on the exercises marked * in Weeks 6-7 and 9-11. After your last working set, lower the weight about 20% and continue to near failure with no rest. Log it with + Drop set; tap ✕ to remove one added by mistake.</div></div>
<div class="card"><div class="nm">Weight suggestions</div><div class="mu">At the start of each session the app suggests a weight from last time and fills it into the boxes. Top of range on every set: add weight (about 2.5-5%, rounded to your equipment). Below the range two sessions in a row: lower 5-10%. Otherwise repeat the weight and add reps. Tap Easy, Right or Too hard after your last set to fine-tune it. You can change any weight, and reset and deload weeks have no suggestions.</div></div>
<div class="card"><div class="nm">Progression</div><div class="mu">Add the smallest weight jump when every set reaches the top of the rep range at the target RIR. After you finish an exercise, the app shows a tip: add weight, stay at this weight, or repeat and lower it if you fall below the range. If weights are maxed: slow the lowering, add a pause, go single-limb, or add band tension.</div></div>
<div class="card"><div class="nm">Phases</div><ul class="ul"><li>Week 0: calibrate loads, no failure</li><li>Weeks 1-3: Foundation</li><li>Week 4: Reset (one fewer set)</li><li>Weeks 5-7: Build (drop sets from Week 6)</li><li>Week 8: Reset</li><li>Weeks 9-11: Peak (Week 11 retest)</li><li>Week 12: Deload</li></ul></div>
<div class="card"><div class="nm">Cool-down stretch</div><div class="mu">After your last exercise, tap Finish workout and then Start stretch (about 3 min). Tap GO for each stretch. Side stretches beep to switch sides. Stretch to mild tension, never pain. TRX stretches have a no-TRX alternative in the cue.</div></div>
<div class="card"><div class="nm">Short on time</div><div class="mu">Skip in this order: optional work, the Thursday finisher, then shorten the ab block. Tired week? Cut Thursday’s TRX chest fly, optional pairs, then one set from each isolation exercise.</div></div>
<div class="card"><div class="nm">Backup</div><div class="mu">Data is stored on this phone only. Export regularly.</div><button class="btn" style="margin-top:8px" onclick="exp()">Export</button> <label class="btn" style="display:inline-block">Import<input type="file" accept=".json" hidden onchange="imp(this.files[0])"></label></div>`}
function ci(w,k,v){(S.ci[w]=S.ci[w]||{})[k]=v;sv()}
function exp(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='forge-backup.json';a.click()}
function imp(f){const r=new FileReader();r.onload=()=>{try{S=JSON.parse(r.result);sv();render()}catch(e){alert('Invalid file')}};r.readAsText(f)}
$('#wk').innerHTML=Array.from({length:13},(_,i)=>`<option value="${i}">Week ${i}${i==0?' (calibrate)':''}</option>`).join('');$('#wk').value=S.wk;$('#wk').onchange=e=>{S.wk=+e.target.value;sv();render()};
render();if('serviceWorker'in navigator)navigator.serviceWorker.register('service-worker.js');
</script></body></html>
